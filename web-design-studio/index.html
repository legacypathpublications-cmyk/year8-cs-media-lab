<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Design Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{--bg:#eef0f5;--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#dfe3ea;--acc:#4f46e5;--acc2:#4338ca;--accbg:#eef2ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--dark:#1e1b4b}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--dark);color:#fff;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;display:flex;gap:9px;align-items:center;margin-right:auto}
.brand i{font-style:normal;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#818cf8,#f472b6)}
.who{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px}
.who input{width:170px;padding:7px 10px;border-radius:9px;border:2px solid transparent;background:#fff;color:var(--ink);font-weight:700}
.who input.miss{border-color:#f87171;background:#fff1f2}
.tb{border:0;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.24)}
.tb.y{background:#fbbf24;color:#1e1b4b}
.tabs{display:flex;gap:2px;padding:6px 10px 0;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 13px;font-weight:700;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-size:14.5px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--acc);border-color:var(--acc)}
.tab small{font-size:10.5px;border-radius:99px;padding:1px 7px;margin-left:5px;vertical-align:2px}
.tab small.r{background:#fee2e2;color:#b91c1c}.tab small.o{background:#e0e7ff;color:#3730a3}
.view{display:none}.view.on{display:block}
/* EDITOR */
.ed{display:grid;grid-template-columns:232px minmax(0,1fr) 280px;height:calc(100vh - 106px);min-height:560px}
.pal{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:10px 12px 20px}
.pal h4{margin:14px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.pal h4:first-child{margin-top:4px}
.pal .items{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pi{border:1px solid var(--line);background:#f9fafb;border-radius:10px;padding:7px 4px 6px;text-align:center;font-size:12.5px;font-weight:600;cursor:grab;user-select:none;line-height:1.2}
.pi:hover{border-color:var(--acc);background:var(--accbg)}
.pi .ic{display:block;font-size:19px;margin-bottom:3px}
.pal .hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.4}
.mid{display:flex;flex-direction:column;min-width:0;min-height:0}
.pagebar{display:flex;gap:6px;align-items:center;padding:7px 10px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.pagebar b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.ptab{border:1px solid var(--line);background:#f9fafb;border-radius:9px;padding:6px 12px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13.5px}
.ptab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.toolbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:7px 10px;background:#f8f9fc;border-bottom:1px solid var(--line)}
.ib{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.ib:hover{border-color:var(--acc)}
.ib.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ib.ex{background:var(--ok);color:#fff;border-color:var(--ok)}
.ib[disabled]{opacity:.4;cursor:default}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;font-size:13px;font-weight:600}
.stage{flex:1;overflow:auto;padding:24px;background:#d9dde5;background-image:radial-gradient(#c3c8d3 1px,transparent 1px);background-size:18px 18px;position:relative}
.stage svg{display:block;margin:0 auto;background:#fff;box-shadow:0 8px 28px rgba(15,23,42,.18);touch-action:none;user-select:none}
.stage.connect svg{cursor:crosshair}
.modebar{position:sticky;top:-24px;z-index:3;margin:-24px -24px 12px;padding:8px 14px;background:#dcfce7;color:#166534;font-weight:700;text-align:center;display:none}
.stage.connect .modebar{display:block}
.props{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:12px 14px 30px}
.props h3{margin:2px 0 10px;font-size:16px}
.props label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px}
.props textarea,.props input[type=text],.props input[type=number],.props select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
.props textarea{min-height:64px;resize:vertical}
.sw{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sw button{width:20px;height:20px;border-radius:5px;border:1px solid #cbd5e1;cursor:pointer;padding:0}
.sw button.none{background:linear-gradient(135deg,#fff 45%,#ef4444 47%,#ef4444 53%,#fff 55%)}
.sw input[type=color]{width:32px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.row4 input{padding:5px 6px!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;font-weight:700;cursor:pointer;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.need{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.need h4{margin:0 0 6px;font-size:14px}
.need ul{margin:0;padding-left:0;list-style:none;font-size:13.5px;line-height:1.45}
.need li{display:flex;gap:7px;margin:5px 0}
.tip{font-size:13px;color:var(--muted);line-height:1.45}
kbd{background:#f1f5f9;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px}
/* FORMS (style guide, content plan) */
.formwrap{display:grid;grid-template-columns:380px minmax(0,1fr);gap:0;height:calc(100vh - 106px);min-height:560px}
.formside{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:16px}
.formside h3{margin:0 0 4px}
.formside label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 5px}
.formside input[type=text],.formside select,.formside textarea,.formside input[type=number]{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.crow{display:grid;grid-template-columns:44px 1fr 92px;gap:6px;align-items:center;margin-bottom:6px}
.crow input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.chk{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:9px;margin:5px 0;font-weight:700;font-size:13.5px}
.chk.p{background:#dcfce7;color:#166534}.chk.f{background:#fee2e2;color:#991b1b}
.ct{width:100%;border-collapse:collapse;font-size:13.5px}
.ct th{background:#eef2ff;text-align:left;padding:6px;font-size:12px}
.ct td{border-bottom:1px solid var(--line);padding:4px;vertical-align:top}
.ct textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:7px;padding:5px;resize:vertical;font-size:13px}
.cpcard{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:#f9fafb}
.cpcard textarea,.cpcard input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px;font-size:13.5px;margin-bottom:4px}
.cpcard textarea{min-height:46px;resize:vertical}
.cpcard .lb{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
/* START */
.start{max-width:1150px;margin:0 auto;padding:22px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 0 var(--line)}
.card h2{margin:0 0 8px;font-size:21px}
.brief{background:linear-gradient(120deg,#eef2ff,#fdf2f8);border-color:#c7d2fe}
.brief ul{margin:8px 0 0;padding-left:20px;line-height:1.6;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff;transition:transform .12s}
.tcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.tcard b{font-size:15.5px}.tcard p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.ck .i{font-size:18px;line-height:1.2}
.ck .t{flex:1}.ck .t small{display:block;color:var(--muted);font-weight:600}
.ck a{font-weight:700;color:var(--acc);cursor:pointer;white-space:nowrap}
.files{list-style:none;padding:0;margin:8px 0 0}
.files li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;font-weight:600;font-size:14px}
.big{font-size:16px;padding:12px 18px;border:0;border-radius:12px;background:var(--ok);color:#fff;font-weight:800;cursor:pointer}
.big.b{background:var(--acc)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:var(--dark);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;z-index:99;transition:transform .25s;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast.bad{background:var(--bad)}#toast.good{background:var(--ok)}
@media (max-width:1100px){.ed{grid-template-columns:200px minmax(0,1fr) 240px}.formwrap{grid-template-columns:320px minmax(0,1fr)}}
@media (max-width:820px){
 .ed,.formwrap{grid-template-columns:1fr;height:auto}
 .pal{max-height:none;border-right:0;border-bottom:1px solid var(--line)}
 .pal .items{grid-template-columns:repeat(4,1fr)}
 .stage{min-height:60vh}
 .props{border-left:0;border-top:1px solid var(--line)}
 .grid2{grid-template-columns:1fr}
 .who input{width:130px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i>✏️</i> Web Design Studio</div>
  <div class="who">Name <input id="sName" placeholder="Your full name" maxlength="40"></div>
  <div class="who">Class <input id="sClass" placeholder="e.g. 9B" maxlength="20" style="width:90px"></div>
  <button class="tb" id="saveBtn" title="Save a copy of all your work to your computer">💾 Save my work</button>
  <button class="tb" id="openBtn" title="Open work you saved before">📂 Open saved work</button>
  <button class="tb y" id="zipBtn">⬇ Download all designs</button>
  <input type="file" id="openFile" accept=".json,application/json" hidden>
  <input type="file" id="imgFile" accept="image/*" hidden>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="views"></main>
<div id="toast"></div>

<script>
/* ===================== HELPERS ===================== */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
const safeName=s=>String(s||'').replace(/[\\/:*?"<>|]+/g,'').trim()||'Untitled';
let toastT;function toast(m,k){const t=$('#toast');t.textContent=m;t.className='show '+(k||'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',2600);}
const FONT='Arial, Helvetica, sans-serif';
const FONTS=['Arial','Verdana','Tahoma','Trebuchet MS','Georgia','Times New Roman','Courier New','Comic Sans MS','Impact','Segoe UI'];
const fstack=f=>!f?FONT:`'${f}', ${/Georgia|Times/.test(f)?'serif':/Courier/.test(f)?'monospace':'sans-serif'}`;
const mctx=document.createElement('canvas').getContext('2d');const wcache=new Map();
function wrap(text,maxW,fs,bold,ff){const key=[text,maxW|0,fs,bold,ff].join('|');if(wcache.has(key))return wcache.get(key);mctx.font=`${bold?'bold ':''}${fs}px ${fstack(ff)}`;const out=[];
 String(text??'').split('\n').forEach(par=>{let line='';par.split(/ +/).forEach(word=>{const t=line?line+' '+word:word;if(mctx.measureText(t).width>maxW&&line){out.push(line);line=word;}else line=t;});out.push(line);});
 if(wcache.size>4000)wcache.clear();wcache.set(key,out);return out;}
const tw=(t,fs,bold,ff)=>{mctx.font=`${bold?'bold ':''}${fs}px ${fstack(ff)}`;return mctx.measureText(String(t)).width;};
function texts(lines,x,y,fs,{anchor='middle',color='#111827',bold,ff,lh=1.25,deco}={}){return lines.map((l,i)=>`<text x="${x}" y="${y+i*fs*lh}" font-size="${fs}" font-family="${esc(fstack(ff))}"${bold?' font-weight="bold"':''} fill="${color}" text-anchor="${anchor}" dominant-baseline="hanging"${deco?` text-decoration="${deco}"`:''}>${esc(l)}</text>`).join('');}
function label(e,o={}){const fs=o.fs||e.fs,align=o.align||e.align||'center',bold=o.bold??e.bold,pad=o.pad??8;const w=(o.w??e.w)-pad*2,h=o.h??e.h;
 const lines=wrap(o.text??e.label,Math.max(10,w),fs,bold,e.ff);const lh=fs*1.25;const maxL=Math.max(1,Math.floor((h-pad*2+lh-fs)/lh));const L=lines.slice(0,o.clip===false?99:maxL);const th=L.length*lh-(lh-fs);
 const va=o.valign||'middle';const oy=o.y||0,ox=o.x||0;const y=oy+(va==='top'?pad:va==='bottom'?h-pad-th:(h-th)/2);const x=ox+(align==='left'?pad:align==='right'?pad+w:pad+w/2);
 return texts(L,x,y,fs,{anchor:{left:'start',center:'middle',right:'end'}[align],color:o.color||e.color,bold,ff:e.ff,deco:o.deco});}
const dashA=e=>e.dash==='dashed'?' stroke-dasharray="9 6"':e.dash==='dotted'?' stroke-dasharray="2 5"':'';
function box(e,rx){rx=rx??(e.round?Math.min(14,e.h/2):0);return `<rect x="0" y="0" width="${e.w}" height="${e.h}" rx="${rx}" fill="${e.fill}" stroke="${e.dash==='none'?'none':e.stroke}" stroke-width="${e.sw||2}"${dashA(e)}/>`;}
const stroke=e=>e.dash==='none'?'none':e.stroke;

/* ===================== ELEMENT TYPES ===================== */
const TY={};
function T(id,o){TY[id]=Object.assign({fs:16,bold:false,align:'center',dash:'solid',round:false,fill:'#e5e7eb',stroke:'#4b5563',color:'#111827',w:220,h:100,label:'',draw:e=>box(e)+label(e)},o,{id});}
// generic shapes
T('rect',{n:'Box',ic:'▭',label:'Box'});
T('round',{n:'Rounded box',ic:'▢',round:true,label:'Box'});
T('ellipse',{n:'Circle',ic:'◯',w:140,h:140,label:'Circle',draw:e=>`<ellipse cx="${e.w/2}" cy="${e.h/2}" rx="${e.w/2}" ry="${e.h/2}" fill="${e.fill}" stroke="${stroke(e)}" stroke-width="2"${dashA(e)}/>`+label(e,{pad:e.w*.15})});
T('diamond',{n:'Diamond',ic:'◇',w:200,h:130,label:'Question?',draw:e=>`<polygon points="${e.w/2},0 ${e.w},${e.h/2} ${e.w/2},${e.h} 0,${e.h/2}" fill="${e.fill}" stroke="${stroke(e)}" stroke-width="2"${dashA(e)}/>`+label(e,{pad:e.w*.2})});
T('triangle',{n:'Triangle',ic:'△',w:140,h:120,label:'',draw:e=>`<polygon points="${e.w/2},0 ${e.w},${e.h} 0,${e.h}" fill="${e.fill}" stroke="${stroke(e)}" stroke-width="2"${dashA(e)}/>`+label(e,{y:e.h*.3,h:e.h*.7,pad:e.w*.2})});
T('text',{n:'Text label',ic:'T',fill:'none',dash:'none',w:220,h:44,fs:20,label:'Text label'});
T('line',{n:'Line',ic:'―',w:220,h:20,fill:'none',label:'',draw:e=>`<line x1="0" y1="${e.h/2}" x2="${e.w}" y2="${e.h/2}" stroke="${e.stroke}" stroke-width="3"${dashA(e)}/>`});
T('arrow',{n:'Arrow',ic:'➜',w:200,h:50,fill:'none',stroke:'#111827',dir:'right',label:'',draw:e=>{const d=e.dir||'right';const p={right:[0,e.h/2,e.w,e.h/2],left:[e.w,e.h/2,0,e.h/2],down:[e.w/2,0,e.w/2,e.h],up:[e.w/2,e.h,e.w/2,0],diag:[0,0,e.w,e.h]}[d];
  return `<line x1="${p[0]}" y1="${p[1]}" x2="${p[2]}" y2="${p[3]}" stroke="${e.stroke}" stroke-width="4"${dashA(e)} marker-end="url(#${mk(e.stroke)})"/>`+(e.label?label(e,{valign:'top',pad:0,fs:14}):'');}});
T('sticky',{n:'Sticky note',ic:'🟨',fill:'#fef08a',stroke:'#ca8a04',w:190,h:150,align:'left',label:'Note',draw:e=>box(e,4)+`<path d="M${e.w-26},${e.h} L${e.w},${e.h-26} L${e.w},${e.h} Z" fill="#00000022"/>`+label(e,{valign:'top',pad:12})});
T('photo',{n:'Photo / image',ic:'📷',fill:'#ffffff',stroke:'#9ca3af',w:360,h:260,label:'',dash:'none',draw:e=>{const img=e.src?`<image href="${e.src}" xlink:href="${e.src}" x="0" y="0" width="${e.w}" height="${e.h}" preserveAspectRatio="xMidYMid meet"/>`:`<rect width="${e.w}" height="${e.h}" fill="#f3f4f6"/>`;
  const cap=e.label?`<rect x="0" y="${e.h-34}" width="${e.w}" height="34" fill="#ffffffdd"/>`+label(e,{y:e.h-34,h:34,pad:6,fs:15}):'';return img+(e.dash==='none'?'':`<rect width="${e.w}" height="${e.h}" fill="none" stroke="${e.stroke}" stroke-width="2"${dashA(e)}/>`)+cap;}});

// WIREFRAME
const lines=(e,x,y,w,h,n)=>{let s='';const gap=Math.max(14,e.fs*1.4);n=n||Math.max(1,Math.floor(h/gap));for(let i=0;i<n;i++){const lw=i===n-1&&n>1?w*.6:w;s+=`<rect x="${x}" y="${y+i*gap}" width="${lw}" height="${Math.max(6,gap*.45)}" rx="3" fill="${e.stroke}" opacity=".35"/>`;}return s;};
const cross=(x,y,w,h,c)=>`<line x1="${x}" y1="${y}" x2="${x+w}" y2="${y+h}" stroke="${c}" stroke-width="1.5" opacity=".6"/><line x1="${x+w}" y1="${y}" x2="${x}" y2="${y+h}" stroke="${c}" stroke-width="1.5" opacity=".6"/>`;
const pill=(e,cx,cy,t,fs)=>{if(!t)return '';const w=Math.min(e.w-10,tw(t,fs,true,e.ff)+18);return `<rect x="${cx-w/2}" y="${cy-fs*.85}" width="${w}" height="${fs*1.7}" rx="${fs*.85}" fill="#fff" stroke="${e.stroke}"/>`+texts([t],cx,cy-fs*.5,fs,{color:e.color,bold:true,ff:e.ff});};
T('header',{n:'Header',ic:'▀',w:1120,h:110,label:'Header: site name and logo',fs:20,bold:true});
T('nav',{n:'Navigation bar',ic:'☰',w:1120,h:56,label:'Home | About | Gallery | Contact',fill:'#d1d5db',draw:e=>{const it=String(e.label).split('|').map(s=>s.trim()).filter(Boolean);if(it.length<2)return box(e)+label(e);const sw=e.w/it.length;let s=box(e);it.forEach((t,i)=>{if(i)s+=`<line x1="${i*sw}" y1="${e.h*.25}" x2="${i*sw}" y2="${e.h*.75}" stroke="${e.stroke}" opacity=".5"/>`;s+=label(e,{text:t,x:i*sw,w:sw,pad:4});});return s;}});
T('logo',{n:'Logo',ic:'◉',w:200,h:80,label:'LOGO',bold:true,round:true,draw:e=>{const r=Math.min(e.h,e.w)*.3;return box(e)+`<circle cx="${r+12}" cy="${e.h/2}" r="${r}" fill="none" stroke="${e.stroke}" stroke-width="2"/>`+label(e,{x:r*2+14,w:e.w-r*2-14});}});

 texts([T.t.toUpperCase()],20,12,12,{anchor:'start',color:'#64748b',bold:true})+texts([pg.name+dv],20,30,22,{anchor:'start',color:'#0f172a',bold:true});}

 const parts=[['Name: ',nm||'(add your name)',!nm],['Class: ',cl||'(add your class)',!cl]];

 parts.forEach(([a,b,miss])=>{s+=texts([a],x,y+(FOOT-fs)/2,fs,{anchor:'start',color:'#c7d2fe'});x+=tw(a,fs);s+=texts([b],x,y+(FOOT-fs)/2,fs,{anchor:'start',color:miss?'#fca5a5':'#ffffff',bold:true});x+=tw(b,fs,true)+24;});
 if(w>=600)s+=texts([`${T.t}: ${pg.name}   •   ${today()}`],w-16,y+(FOOT-fs)/2,fs,{anchor:'end',color:'#c7d2fe'});
 else s+=texts([pg.name],w-12,y+(FOOT-fs)/2,fs,{anchor:'end',color:'#c7d2fe'});return s;}
const MK=new Set();const mk=c=>{const id='ah'+String(c).replace(/[^a-z0-9]/gi,'');MK.add(c+'|'+id);return id;};
function markerDefs(){return '<defs>'+[...MK].map(s=>{const [c,id]=s.split('|');return `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`;}).join('')+'</defs>';}
function gridInfo(tool,pg){if(!TOOLS[tool].grid)return null;const {w}=pageSize(tool,pg);const cols=DEV[pg.device].cols;const m=w<600?16:40,g=w<600?12:20;const cw=(w-2*m-g*(cols-1))/cols;const starts=[],ends=[];for(let i=0;i<cols;i++){starts.push(m+i*(cw+g));ends.push(m+i*(cw+g)+cw);}
 return {cols,m,g,cw,starts,ends,span:e=>{let a=0,b=0;starts.forEach((s,i)=>{if(Math.abs(e.x-s)<Math.abs(e.x-starts[a]))a=i;});ends.forEach((s,i)=>{if(Math.abs(e.x+e.w-s)<Math.abs(e.x+e.w-ends[b]))b=i;});return Math.max(1,b-a+1);}};}

function edgePt(r,tx,ty){const cx=r.x+r.w/2,cy=r.y+r.h/2;const dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return {x:cx,y:cy};const s=Math.min(dx?r.w/2/Math.abs(dx):1e9,dy?r.h/2/Math.abs(dy):1e9);return {x:cx+dx*s,y:cy+dy*s};}
function linkSvg(L,els,style,edit){const a=els.find(e=>e.id===L.from),b=els.find(e=>e.id===L.to);if(!a||!b)return '';const col=L.color||'#374151';let d,mid;
 const st=L.style||style;
 if(st==='elbow'){const ac={x:a.x+a.w/2,y:a.y+a.h/2},bc={x:b.x+b.w/2,y:b.y+b.h/2};

 const ch=id=>order.filter(k=>parent[k]===id);const leaves=id=>{const c=ch(id);return c.length?c.reduce((a,k)=>a+leaves(k),0):1;};

function hex6(h){h=String(h||'').trim();if(/^#?[0-9a-f]{3}$/i.test(h)){h=h.replace('#','');h='#'+h.split('').map(c=>c+c).join('');}if(!h.startsWith('#'))h='#'+h;return /^#[0-9a-f]{6}$/i.test(h)?h.toLowerCase():null;}

function ratio(a,b){const l1=lum(a),l2=lum(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);}
const bestOn=bg=>ratio('#ffffff',bg)>=ratio('#111827',bg)?'#ffffff':'#111827';
function sgChecks(){const s=P.style;const c=r=>(s.colours.find(x=>x.role===r)||s.colours[0]).hex;const bg=c('Background'),tx=c('Text'),pr=c('Primary');
 return [['Body text on the background',ratio(tx,bg),4.5],['Headings (primary colour) on the background',ratio(pr,bg),3],['Button text on the primary colour',ratio(bestOn(pr),pr),4.5]];}

$('#views').innerHTML=ORDER.map(t=>`<section class="view" id="v_${t}"></section>`).join('');
['sitemap','wire','layout','flow','mood'].forEach(buildEditor);

/* ===================== SAVE / OPEN / NAME ===================== */
function saveFile(){const blob=new Blob([JSON.stringify(P)],{type:'application/json'});saveBlob(blob,`${safeName(P.name||'My')} ${safeName(P.cls||'')} - web design work.json`.replace(/\s+-/,' -'));toast('Saved. Keep this file safe and open it next lesson.','good');}
$('#saveBtn').onclick=saveFile;$('#openBtn').onclick=()=>{$('#openFile').value='';$('#openFile').click();};
$('#openFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o.tools||!o.tools.wire)throw 0;if(!confirm('Open this saved work? It replaces what is on screen now.'))return;
 const b=blank();P=Object.assign(b,o);['sitemap','wire','layout','flow','mood'].forEach(t=>{if(!P.tools[t])P.tools[t]=b.tools[t];});P.style=Object.assign(blank().style,o.style||{});P.content=o.content||{rows:[]};
 Object.keys(H).forEach(k=>delete H[k]);persist();$('#sName').value=P.name||'';$('#sClass').value=P.cls||'';go(S.tool);toast('Your saved work is open.','good');}catch(err){toast('That file is not saved web design work.','bad');}};fr.readAsText(f);};
$('#zipBtn').onclick=downloadAll;
$('#sName').value=P.name||'';$('#sClass').value=P.cls||'';
const nameUpd=()=>{P.name=$('#sName').value;P.cls=$('#sClass').value;$('#sName').classList.remove('miss');$('#sClass').classList.remove('miss');persist();if(TOOLS[S.tool].canvas)draw();else if(S.tool==='style')drawStyle();else if(S.tool==='content')drawContent();updateBadges();};
$('#sName').oninput=nameUpd;$('#sClass').oninput=nameUpd;
const startTab=location.hash.slice(1);go(TOOLS[startTab]?startTab:'start');
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TOOLS[t]&&t!==S.tool)go(t);});
</script>
