<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Design Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{--bg:#f1f3f9;--panel:#fff;--ink:#1f2937;--muted:#64748b;--line:#e2e6ef;--acc:#5b4bf5;--acc2:#4636d8;--accbg:#eeecff;--ok:#16a34a;--bad:#dc2626;--dark:#1b1840;--topH:60px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* TOP BAR */
.top{height:var(--topH);display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--dark);color:#fff}
.brand{font-weight:800;font-size:18px;display:flex;gap:10px;align-items:center;margin-right:auto;white-space:nowrap}
.brand b{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#8b7bff,#f472b6)}
.brand b svg{width:22px;height:22px}
.who{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:5px 6px 5px 10px;border-radius:12px}
.who svg{opacity:.8}
.who input{width:160px;padding:6px 9px;border-radius:8px;border:2px solid transparent;background:#fff;color:var(--ink);font-weight:700}
.who input#sClass{width:80px}
.who input.miss{border-color:#f87171;background:#fff1f2}
.tb{display:flex;align-items:center;gap:7px;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.22)}
.tb.y{background:#fbbf24;color:#1b1840}.tb.y:hover{background:#fcd34d}
.tb.ic{padding:8px}
/* APP SHELL */
.app{display:grid;grid-template-columns:92px minmax(0,1fr);height:calc(100vh - var(--topH))}
.rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:10px 8px;overflow:auto}
.ri{position:relative;border:0;background:none;border-radius:14px;padding:8px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-weight:700;font-size:11.5px;line-height:1.15;text-align:center}
.ri .rt{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);transition:transform .15s}
.ri .rt svg{width:24px;height:24px}
.ri:hover{background:#f6f7fb;color:var(--ink)}.ri:hover .rt{transform:scale(1.07)}
.ri.on{background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--ink)}
.ri.on .rt{background:var(--c);color:#fff;box-shadow:0 4px 10px color-mix(in srgb,var(--c) 40%,transparent)}
.ri .rb{position:absolute;top:4px;right:8px;font-size:10px;font-weight:800;border-radius:99px;padding:1px 6px;background:#fee2e2;color:#b91c1c}
.ri .rb.d{background:#dcfce7;color:#166534}.ri .rb.o{background:#e0e7ff;color:#3730a3}
.rail hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#views{min-width:0;height:100%;overflow:hidden}
.view{display:none;height:100%}.view.on{display:block}
/* EDITOR */
.ed{display:grid;grid-template-columns:250px minmax(0,1fr) 292px;height:100%}
.pal{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:12px 12px 24px}
.psearch{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#f8fafc;margin-bottom:6px}
.psearch input{border:0;background:none;outline:none;width:100%}
.pg{margin-top:10px}
.pg>button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 2px;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.pg>button svg.i{width:16px;height:16px}.pg>button .chev{margin-left:auto;transition:transform .15s}
.pg.shut>button .chev{transform:rotate(-90deg)}.pg.shut .items{display:none}
.pal .items{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pi{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 3px 6px;text-align:center;font-size:11.5px;font-weight:650;cursor:grab;user-select:none;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .12s}
.pi:hover{border-color:var(--acc);background:var(--accbg);transform:translateY(-2px);box-shadow:0 4px 10px rgba(91,75,245,.15)}
.pi .th{width:62px;height:42px;display:grid;place-items:center;background:#f8fafc;border-radius:8px}
.pi .th svg{display:block}
.pal .hint{display:flex;gap:8px;font-size:12.5px;color:var(--muted);margin:14px 2px 0;line-height:1.4;background:#f8fafc;border-radius:10px;padding:9px}
.mid{display:flex;flex-direction:column;min-width:0;min-height:0}
.pagebar{display:flex;gap:6px;align-items:center;padding:7px 10px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.ptab{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:6px 11px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13.5px}
.ptab svg.i{width:16px;height:16px;opacity:.7}
.ptab.on{background:var(--acc);color:#fff;border-color:var(--acc)}.ptab.on svg{opacity:1}
.pbtn{display:flex;align-items:center;gap:5px;border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:6px 8px;border-radius:9px;cursor:pointer;white-space:nowrap}
.pbtn:hover{background:#f1f5f9;color:var(--ink)}.pbtn svg.i{width:17px;height:17px}
.pbtn.add{color:var(--acc)}
.ribbon{display:flex;gap:4px;align-items:stretch;padding:6px 8px;background:#fbfbfe;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.grp{display:flex;flex-direction:column;align-items:center;padding:0 6px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.gb{display:flex;gap:2px;align-items:center}
.gl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin-top:2px}
.rbn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px;border:0;background:none;border-radius:10px;padding:5px 5px 4px;cursor:pointer;font-size:11px;font-weight:650;color:#334155;white-space:nowrap}
.rbn:hover{background:#eef0f7}.rbn svg.i{width:21px;height:21px}
.rbn.on{background:var(--accbg);color:var(--acc2);box-shadow:inset 0 0 0 1.5px var(--acc)}
.rbn.go{background:var(--ok);color:#fff}.rbn.go:hover{background:#15803d}
.rbn[disabled]{opacity:.35;cursor:default;background:none}
.zoombox{position:absolute;right:18px;bottom:16px;z-index:7;display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:0 6px 16px rgba(15,23,42,.15)}
.zoombox button{border:0;background:none;width:32px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:#334155}.zoombox button:hover{background:#eef0f7}.zoombox svg.i{width:18px;height:18px}
.pdl{margin-left:auto;display:flex;align-items:center;gap:6px;border:0;background:var(--ok);color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}.pdl:hover{background:#15803d}.pdl svg.i{width:17px;height:17px}
.mid{position:relative}
.zl{font-weight:800;font-size:12px;min-width:40px;text-align:center;align-self:center}
.stage{flex:1;overflow:auto;padding:26px;background:#dfe3ec;background-image:radial-gradient(#c6ccd8 1px,transparent 1px);background-size:18px 18px;position:relative}
.stage>svg{display:block;margin:0 auto;background:#fff;box-shadow:0 10px 30px rgba(15,23,42,.18);touch-action:none;user-select:none;border-radius:4px}
.stage.connect>svg{cursor:crosshair}
.modebar{position:sticky;top:-26px;z-index:6;margin:-26px -26px 14px;padding:9px 14px;background:#dcfce7;color:#166534;font-weight:700;display:none;align-items:center;justify-content:center;gap:8px}
.stage.connect .modebar{display:flex}
.empty{position:absolute;left:50%;top:150px;transform:translateX(-50%);z-index:4;pointer-events:none;background:#fff;border:2px dashed #a5b4fc;border-radius:18px;padding:18px 22px;text-align:center;max-width:380px;box-shadow:0 8px 20px rgba(0,0,0,.08);display:none}
.empty b{display:block;font-size:17px;margin:6px 0 4px}.empty p{margin:0;color:var(--muted);font-size:14px}
.empty .big{width:50px;height:50px;margin:0 auto;border-radius:14px;background:var(--accbg);color:var(--acc);display:grid;place-items:center}
.minibar{position:absolute;z-index:5;display:none;gap:2px;background:var(--dark);border-radius:11px;padding:4px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.minibar button{border:0;background:none;color:#fff;border-radius:8px;width:32px;height:30px;display:grid;place-items:center;cursor:pointer}
.minibar button:hover{background:rgba(255,255,255,.18)}.minibar svg.i{width:17px;height:17px}
.minibar button.del:hover{background:#ef4444}
/* PROPS */
.props{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:12px 12px 30px}
.phead{display:flex;align-items:center;gap:10px;margin:2px 2px 10px}
.phead .th{width:54px;height:40px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.phead h3{margin:0;font-size:16px}.phead small{display:block;color:var(--muted);font-weight:600}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px;font-size:11px;font-weight:700;cursor:pointer}
.qa button:hover{border-color:var(--acc);background:var(--accbg)}.qa button.del{color:#dc2626}.qa button.del:hover{border-color:#dc2626;background:#fef2f2}
.psec{border:1px solid var(--line);border-radius:14px;padding:10px 11px;margin-top:9px;background:#fff}
.ph{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;margin-bottom:8px;color:#334155}
.ph svg.i{width:17px;height:17px;color:var(--acc)}
.props textarea,.props input[type=text],.props input[type=number],.props select{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff}
.props textarea{min-height:60px;resize:vertical}
.ctabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.ctabs button{display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:#f8fafc;border-radius:9px;padding:5px;font-size:12px;font-weight:700;cursor:pointer}
.ctabs button i{width:14px;height:14px;border-radius:4px;border:1px solid #94a3b8;display:inline-block}
.ctabs button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc2)}
.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;align-items:center}
.sw button{aspect-ratio:1;border-radius:6px;border:1px solid #cbd5e1;cursor:pointer;padding:0}
.sw button.sel{outline:2.5px solid var(--acc);outline-offset:1px}
.sw button.none{background:linear-gradient(135deg,#fff 44%,#ef4444 46%,#ef4444 54%,#fff 56%)}
.sw label.pick{grid-column:span 2;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.sw input[type=color]{width:26px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.iseg{display:flex;gap:3px;flex-wrap:wrap}
.iseg button{display:grid;place-items:center;min-width:36px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;padding:0 7px;font-weight:700;font-size:13px}
.iseg button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc2)}
.iseg button svg.i{width:18px;height:18px}
.rowf{display:flex;gap:8px;align-items:center;margin-top:8px}
.rowf input[type=range]{flex:1}
.num{font-weight:800;min-width:30px;text-align:right}
.xywh{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.xywh div{font-size:10.5px;font-weight:800;color:var(--muted);text-align:center}
.xywh input{padding:5px!important;text-align:center}
.need{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:10px}
.need h4{margin:0 0 6px;font-size:14px;display:flex;gap:7px;align-items:center}
.need ul{margin:0;padding:0;list-style:none;font-size:13.5px;line-height:1.4}
.need li{display:flex;gap:8px;margin:7px 0;align-items:flex-start}
.need li .dot{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid #cbd5e1;margin-top:1px}
.need li .dot.y{background:var(--ok);border-color:var(--ok);color:#fff}.need li .dot.n{border-style:dashed}
.need li .dot svg{width:12px;height:12px;stroke-width:3}
.tip{font-size:13px;color:var(--muted);line-height:1.45}
.tiprow{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#475569;line-height:1.4;margin:8px 0}
.tiprow svg.i{width:18px;height:18px;color:var(--acc);margin-top:1px}
kbd{background:#f1f5f9;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11.5px}
/* MENUS */
.menu{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(15,23,42,.22);padding:6px;min-width:220px;max-width:320px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:650;text-align:left}
.menu button:hover{background:var(--accbg)}.menu button svg.i{width:18px;height:18px;color:var(--acc)}
.menu button small{margin-left:auto;color:#94a3b8;font-weight:600;font-size:11.5px}
.menu button.del{color:#dc2626}.menu button.del svg{color:#dc2626}
.menu button[disabled]{opacity:.4;cursor:default;background:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px}
.menu .mt{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#94a3b8;padding:6px 10px 2px}
.menu .sw{padding:6px;width:280px}
/* HELP */
.ov{position:fixed;inset:0;z-index:90;background:rgba(27,24,64,.55);display:none;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.help{background:#fff;border-radius:22px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.help h2{margin:0 0 4px;display:flex;align-items:center;gap:10px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
.hstep{display:flex;gap:11px;border:1px solid var(--line);border-radius:14px;padding:11px}
.hstep .hi{width:40px;height:40px;border-radius:12px;background:var(--accbg);color:var(--acc);display:grid;place-items:center;flex:none}
.hstep b{display:block;margin-bottom:2px}.hstep span{font-size:13.5px;color:#475569;line-height:1.4}
/* FORMS */
.formwrap{display:grid;grid-template-columns:390px minmax(0,1fr);height:100%}
.formside{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:16px}
.fhead{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.fhead .rt{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--c);color:#fff}
.fhead .rt svg{width:24px;height:24px}
.fhead h3{margin:0;font-size:18px}
.formside label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.formside label svg.i{width:16px;height:16px;color:var(--acc)}
.formside input[type=text],.formside select,.formside textarea,.formside input[type=number]{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.crow{display:grid;grid-template-columns:44px 1fr 96px;gap:6px;align-items:center;margin-bottom:6px}
.crow input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:9px;padding:2px;background:#fff;cursor:pointer}
.chk{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:9px;margin:5px 0;font-weight:700;font-size:13.5px}
.chk.p{background:#dcfce7;color:#166534}.chk.f{background:#fee2e2;color:#991b1b}
.cpcard{border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;background:#f9fafb}
.cpcard textarea,.cpcard input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:13.5px;margin-bottom:4px;background:#fff}
.cpcard textarea{min-height:44px;resize:vertical}
.cpcard .lb{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.fbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13.5px}
.fbtn:hover{border-color:var(--acc);background:var(--accbg)}
.fbtn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.fbtn svg.i{width:17px;height:17px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.formwrap .stage{height:100%}
.ib{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;cursor:pointer;font-weight:600}
/* START */
.startv{height:100%;overflow:auto}
.start{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:9px}
.card h2 svg.i{width:22px;height:22px;color:var(--acc)}
.brief{background:linear-gradient(120deg,#eeecff,#fdf2f8);border-color:#d4d0ff}
.brief ul{margin:6px 0 0;padding:0;list-style:none}
.brief li{display:flex;gap:10px;align-items:flex-start;margin:9px 0;font-weight:600;line-height:1.45}
.brief li .bi{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--acc);display:grid;place-items:center;flex:none}
.brief li .bi svg{width:18px;height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:13px;cursor:pointer;background:#fff;transition:all .15s;text-align:left}
.tile:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 20%,transparent)}
.tile .rt{width:48px;height:48px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.tile .rt svg{width:26px;height:26px}
.tile b{font-size:15.5px}.tile p{margin:3px 0 0;color:var(--muted);font-size:13.5px;line-height:1.35}
.req{background:#fee2e2;color:#b91c1c;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:800;margin-left:4px;vertical-align:2px}
.ck{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.ck .rt{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.ck .rt svg{width:19px;height:19px}
.ck .t{flex:1}.ck .t small{display:block;color:var(--muted);font-weight:600}
.ck .bar{height:6px;border-radius:9px;background:#eef0f5;margin-top:4px;overflow:hidden}.ck .bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.ck a{font-weight:700;color:var(--acc);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:3px}
.files{list-style:none;padding:0;margin:10px 0 0}
.files li{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:11px;margin:6px 0;font-weight:600;font-size:14px}
.files li svg.i{color:var(--acc)}.files li span{flex:1}
.files li button{border:0;background:var(--accbg);color:var(--acc2);border-radius:8px;padding:5px 8px;cursor:pointer;display:grid;place-items:center}
.big{display:inline-flex;align-items:center;gap:9px;font-size:16px;padding:12px 18px;border:0;border-radius:13px;background:var(--ok);color:#fff;font-weight:800;cursor:pointer}
.big.b{background:var(--acc)}

#toast.show{transform:translate(-50%,0);opacity:1}
#toast.bad{background:var(--bad)}#toast.good{background:var(--ok)}
@media (max-width:1440px){.ed{grid-template-columns:226px minmax(0,1fr) 266px}.rbn{min-width:43px;padding:5px 3px 4px;font-size:10.5px}.grp{padding:0 3px}.pal .items{grid-template-columns:1fr 1fr 1fr}.pi .th{width:56px}}
.ribbon{flex-wrap:wrap;row-gap:4px}
@media (max-width:1180px){.ed{grid-template-columns:220px minmax(0,1fr) 260px}.pal .items{grid-template-columns:1fr 1fr}.formwrap{grid-template-columns:330px minmax(0,1fr)}.tb span{display:none}.tb{padding:8px}}
@media (max-width:820px){
 body{overflow:auto}
 .top{height:auto;flex-wrap:wrap;padding:8px 10px}.who input{width:120px}
 .app{grid-template-columns:1fr;height:auto}
 .rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}.rail hr{display:none}.ri{min-width:76px}
 .ed,.formwrap{grid-template-columns:1fr;height:auto}
 .pal .items{grid-template-columns:repeat(4,1fr)}
 .stage{min-height:65vh}.props{border-left:0;border-top:1px solid var(--line)}
 .grid2{grid-template-columns:1fr}#views{height:auto;overflow:visible}.view{height:auto}
}

<body>
<header class="top">
  <div class="brand"><b><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg></b> Web Design Studio</div>
  <div class="who" title="Your name and class appear in the footer of every design"><svg class="i" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg><input id="sName" placeholder="Your full name" maxlength="40"><input id="sClass" placeholder="Class" maxlength="20"></div>
  <button class="tb ic" id="helpBtn" title="How to use the studio"></button>
  <button class="tb" id="saveBtn" title="Save a copy of all your work to your computer"></button>
  <button class="tb" id="openBtn" title="Open work you saved before"></button>
  <button class="tb y" id="zipBtn" title="Download every design as images named by page"></button>
  <input type="file" id="openFile" accept=".json,application/json" hidden>
  <input type="file" id="imgFile" accept="image/*" hidden>
</header>
<div class="app"><nav class="rail" id="tabs"></nav><main id="views"></main></div>
<div class="ov" id="helpOv"></div>
<div id="toast"></div>

<script>

/* ===================== HELPERS ===================== */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
const safeName=s=>String(s||'').replace(/[\\/:*?"<>|]+/g,'').trim()||'Untitled';
let toastT;function toast(m,k){const t=$('#toast');t.textContent=m;t.className='show '+(k||'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',2600);}
const FONT='Arial, Helvetica, sans-serif';
const FONTS=['Arial','Verdana','Tahoma','Trebuchet MS','Georgia','Times New Roman','Courier New','Comic Sans MS','Impact','Segoe UI'];
const fstack=f=>!f?FONT:`'${f}', ${/Georgia|Times/.test(f)?'serif':/Courier/.test(f)?'monospace':'sans-serif'}`;
const mctx=document.createElement('canvas').getContext('2d');const wcache=new Map();
function wrap(text,maxW,fs,bold,ff){const key=[text,maxW|0,fs,bold,ff].join('|');if(wcache.has(key))return wcache.get(key);mctx.font=`${bold?'bold ':''}${fs}px ${fstack(ff)}`;const out=[];
 String(text??'').split('\n').forEach(par=>{let line='';par.split(/ +/).forEach(word=>{const t=line?line+' '+word:word;if(mctx.measureText(t).width>maxW&&line){out.push(line);line=word;}else line=t;});out.push(line);});
 if(wcache.size>4000)wcache.clear();wcache.set(key,out);return out;}
const tw=(t,fs,bold,ff)=>{mctx.font=`${bold?'bold ':''}${fs}px ${fstack(ff)}`;return mctx.measureText(String(t)).width;};
function texts(lines,x,y,fs,{anchor='middle',color='#111827',bold,ff,lh=1.25,deco,italic}={}){return lines.map((l,i)=>`<text x="${x}" y="${y+i*fs*lh}" font-size="${fs}" font-family="${esc(fstack(ff))}"${bold?' font-weight="bold"':''}${italic?' font-style="italic"':''} fill="${color}" text-anchor="${anchor}" dominant-baseline="hanging"${deco?` text-decoration="${deco}"`:''}>${esc(l)}</text>`).join('');}
function label(e,o={}){const fs=o.fs||e.fs,align=o.align||e.align||'center',bold=o.bold??e.bold,pad=o.pad??8;const w=(o.w??e.w)-pad*2,h=o.h??e.h;
 const lines=wrap(o.text??e.label,Math.max(10,w),fs,bold,e.ff);const lh=fs*1.25;const maxL=Math.max(1,Math.floor((h-pad*2+lh-fs)/lh));const L=lines.slice(0,o.clip===false?99:maxL);const th=L.length*lh-(lh-fs);
 const va=o.valign||'middle';const oy=o.y||0,ox=o.x||0;const y=oy+(va==='top'?pad:va==='bottom'?h-pad-th:(h-th)/2);const x=ox+(align==='left'?pad:align==='right'?pad+w:pad+w/2);
 return texts(L,x,y,fs,{anchor:{left:'start',center:'middle',right:'end'}[align],color:o.color||e.color,bold,ff:e.ff,deco:o.deco,italic:e.italic});}
const dashA=e=>e.dash==='dashed'?' stroke-dasharray="9 6"':e.dash==='dotted'?' stroke-dasharray="2 5"':'';
function box(e,rx){rx=rx??(e.round?Math.min(14,e.h/2):0);return `<rect x="0" y="0" width="${e.w}" height="${e.h}" rx="${rx}" fill="${e.fill}" stroke="${e.dash==='none'?'none':e.stroke}" stroke-width="${e.sw||2}"${dashA(e)}/>`;}
const stroke=e=>e.dash==='none'?'none':e.stroke;

/* ===================== ELEMENT TYPES ===================== */
const TY={};
function T(id,o){TY[id]=Object.assign({fs:16,bold:false,align:'center',dash:'solid',round:false,fill:'#e5e7eb',stroke:'#4b5563',color:'#111827',w:220,h:100,label:'',draw:e=>box(e)+label(e)},o,{id});}
// generic shapes
T('rect',{n:'Box',ic:'▭',label:'Box'});
T('round',{n:'Rounded box',ic:'▢',round:true,label:'Box'});
T('ellipse',{n:'Circle',ic:'◯',w:140,h:140,label:'Circle',draw:e=>`<ellipse cx="${e.w/2}" cy="${e.h/2}" rx="${e.w/2}" ry="${e.h/2}" fill="${e.fill}" stroke="${stroke(e)}" stroke-width="2"${dashA(e)}/>`+label(e,{pad:e.w*.15})});
T('diamond',{n:'Diamond',ic:'◇',w:200,h:130,label:'Question?',draw:e=>`<polygon points="${e.w/2},0 ${e.w},${e.h/2} ${e.w/2},${e.h} 0,${e.h/2}" fill="${e.fill}" stroke="${stroke(e)}" stroke-width="2"${dashA(e)}/>`+label(e,{pad:e.w*.2})});
T('triangle',{n:'Triangle',ic:'△',w:140,h:120,label:'',draw:e=>`<polygon points="${e.w/2},0 ${e.w},${e.h} 0,${e.h}" fill="${e.fill}" stroke="${stroke(e)}" stroke-width="2"${dashA(e)}/>`+label(e,{y:e.h*.3,h:e.h*.7,pad:e.w*.2})});
T('text',{n:'Text label',ic:'T',fill:'none',dash:'none',w:220,h:44,fs:20,label:'Text label'});
T('line',{n:'Line',ic:'―',w:220,h:20,fill:'none',label:'',draw:e=>`<line x1="0" y1="${e.h/2}" x2="${e.w}" y2="${e.h/2}" stroke="${e.stroke}" stroke-width="3"${dashA(e)}/>`});
T('arrow',{n:'Arrow',ic:'➜',w:200,h:50,fill:'none',stroke:'#111827',dir:'right',label:'',draw:e=>{const d=e.dir||'right';const p={right:[0,e.h/2,e.w,e.h/2],left:[e.w,e.h/2,0,e.h/2],down:[e.w/2,0,e.w/2,e.h],up:[e.w/2,e.h,e.w/2,0],diag:[0,0,e.w,e.h]}[d];
  return `<line x1="${p[0]}" y1="${p[1]}" x2="${p[2]}" y2="${p[3]}" stroke="${e.stroke}" stroke-width="4"${dashA(e)} marker-end="url(#${mk(e.stroke)})"/>`+(e.label?label(e,{valign:'top',pad:0,fs:14}):'');}});
T('sticky',{n:'Sticky note',ic:'🟨',fill:'#fef08a',stroke:'#ca8a04',w:190,h:150,align:'left',label:'Note',draw:e=>box(e,4)+`<path d="M${e.w-26},${e.h} L${e.w},${e.h-26} L${e.w},${e.h} Z" fill="#00000022"/>`+label(e,{valign:'top',pad:12})});
T('photo',{n:'Photo / image',ic:'📷',fill:'#ffffff',stroke:'#9ca3af',w:360,h:260,label:'',dash:'none',draw:e=>{const img=e.src?`<image href="${e.src}" xlink:href="${e.src}" x="0" y="0" width="${e.w}" height="${e.h}" preserveAspectRatio="xMidYMid meet"/>`:`<rect width="${e.w}" height="${e.h}" fill="#f3f4f6"/>`;
  const cap=e.label?`<rect x="0" y="${e.h-34}" width="${e.w}" height="34" fill="#ffffffdd"/>`+label(e,{y:e.h-34,h:34,pad:6,fs:15}):'';return img+(e.dash==='none'?'':`<rect width="${e.w}" height="${e.h}" fill="none" stroke="${e.stroke}" stroke-width="2"${dashA(e)}/>`)+cap;}});

// WIREFRAME
const lines=(e,x,y,w,h,n)=>{let s='';const gap=Math.max(14,e.fs*1.4);n=n||Math.max(1,Math.floor(h/gap));for(let i=0;i<n;i++){const lw=i===n-1&&n>1?w*.6:w;s+=`<rect x="${x}" y="${y+i*gap}" width="${lw}" height="${Math.max(6,gap*.45)}" rx="3" fill="${e.stroke}" opacity=".35"/>`;}return s;};
const cross=(x,y,w,h,c)=>`<line x1="${x}" y1="${y}" x2="${x+w}" y2="${y+h}" stroke="${c}" stroke-width="1.5" opacity=".6"/><line x1="${x+w}" y1="${y}" x2="${x}" y2="${y+h}" stroke="${c}" stroke-width="1.5" opacity=".6"/>`;
const pill=(e,cx,cy,t,fs)=>{if(!t)return '';const w=Math.min(e.w-10,tw(t,fs,true,e.ff)+18);return `<rect x="${cx-w/2}" y="${cy-fs*.85}" width="${w}" height="${fs*1.7}" rx="${fs*.85}" fill="#fff" stroke="${e.stroke}"/>`+texts([t],cx,cy-fs*.5,fs,{color:e.color,bold:true,ff:e.ff});};
T('header',{n:'Header',ic:'▀',w:1120,h:110,label:'Header: site name and logo',fs:20,bold:true});
T('nav',{n:'Navigation bar',ic:'☰',w:1120,h:56,label:'Home | About | Gallery | Contact',fill:'#d1d5db',draw:e=>{const it=String(e.label).split('|').map(s=>s.trim()).filter(Boolean);if(it.length<2)return box(e)+label(e);const sw=e.w/it.length;let s=box(e);it.forEach((t,i)=>{if(i)s+=`<line x1="${i*sw}" y1="${e.h*.25}" x2="${i*sw}" y2="${e.h*.75}" stroke="${e.stroke}" opacity=".5"/>`;s+=label(e,{text:t,x:i*sw,w:sw,pad:4});});return s;}});
T('logo',{n:'Logo',ic:'◉',w:200,h:80,label:'LOGO',bold:true,round:true,draw:e=>{const r=Math.min(e.h,e.w)*.3;return box(e)+`<circle cx="${r+12}" cy="${e.h/2}" r="${r}" fill="none" stroke="${e.stroke}" stroke-width="2"/>`+label(e,{x:r*2+14,w:e.w-r*2-14});}});
T('heading',{n:'Heading',ic:'H',fill:'none',dash:'none',w:600,h:56,fs:34,bold:true,align:'left',label:'Page heading'});
T('para',{n:'Paragraph text',ic:'≡',fill:'none',dash:'none',w:520,h:150,fs:14,align:'left',label:'Paragraph: about the page',draw:e=>{const cap=e.label?label(e,{valign:'top',h:e.fs*2,pad:2,bold:true}):'';const top=e.label?e.fs*1.9:2;return (e.fill!=='none'||e.dash!=='none'?box(e):'')+cap+lines(e,2,top,e.w-4,e.h-top);}});
T('image',{n:'Image',ic:'🖼',w:360,h:240,label:'Image: photo of the shop',fill:'#f3f4f6',draw:e=>box(e)+cross(0,0,e.w,e.h,e.stroke)+pill(e,e.w/2,e.h/2,e.label,e.fs)});
T('video',{n:'Video',ic:'▶',w:420,h:240,label:'Video: tour',fill:'#f3f4f6',draw:e=>{const r=Math.min(e.w,e.h)*.16;return box(e)+`<circle cx="${e.w/2}" cy="${e.h/2-8}" r="${r}" fill="#fff" stroke="${e.stroke}" stroke-width="2"/><polygon points="${e.w/2-r*.35},${e.h/2-8-r*.5} ${e.w/2-r*.35},${e.h/2-8+r*.5} ${e.w/2+r*.55},${e.h/2-8}" fill="${e.stroke}"/>`+label(e,{valign:'bottom',pad:10,bold:true});}});
T('button',{n:'Button',ic:'🔘',w:180,h:54,round:true,fill:'#6b7280',stroke:'#374151',color:'#ffffff',bold:true,label:'Button'});
T('input',{n:'Text box',ic:'⌨',w:320,h:46,fill:'#ffffff',color:'#6b7280',align:'left',label:'Type here…',round:false});
T('search',{n:'Search bar',ic:'🔍',w:320,h:46,fill:'#ffffff',color:'#6b7280',align:'left',label:'Search…',draw:e=>{const r=e.h*.2;return box(e)+label(e,{w:e.w-e.h})+`<circle cx="${e.w-e.h/2-2}" cy="${e.h/2-2}" r="${r}" fill="none" stroke="${e.stroke}" stroke-width="2.5"/><line x1="${e.w-e.h/2+r*.6}" y1="${e.h/2+r*.6}" x2="${e.w-e.h/2+r*1.4}" y2="${e.h/2+r*1.4}" stroke="${e.stroke}" stroke-width="2.5"/>`;}});
T('form',{n:'Form',ic:'📝',w:420,h:330,label:'Contact form',bold:true,fill:'#f9fafb',draw:e=>{let s=box(e)+label(e,{valign:'top',h:40,pad:12,align:'left'});const fh=Math.max(26,(e.h-120)/4.2);['Name','Email','Message'].forEach((t,i)=>{const y=48+i*(fh+12);const hh=i===2?fh*1.5:fh;s+=`<rect x="14" y="${y}" width="${e.w-28}" height="${hh}" fill="#fff" stroke="${e.stroke}" stroke-width="1.5"/>`+texts([t],24,y+hh/2-7,14,{anchor:'start',color:'#6b7280'});});s+=`<rect x="14" y="${e.h-50}" width="130" height="38" rx="8" fill="#6b7280"/>`+texts(['Send'],79,e.h-38,15,{color:'#fff',bold:true});return s;}});
T('card',{n:'Card',ic:'🃏',w:330,h:340,label:'Card title',bold:true,fill:'#ffffff',draw:e=>{const ih=e.h*.5;return box(e)+`<rect x="10" y="10" width="${e.w-20}" height="${ih}" fill="#f3f4f6" stroke="${e.stroke}" stroke-width="1"/>`+cross(10,10,e.w-20,ih,e.stroke)+label(e,{y:ih+14,h:e.fs*1.6,valign:'top',pad:12,align:'left'})+lines(e,12,ih+18+e.fs*1.6,e.w-24,e.h-ih-30-e.fs*1.6);}});
T('sidebar',{n:'Sidebar',ic:'▐',w:280,h:520,label:'Sidebar: links and adverts',draw:e=>box(e)+label(e,{valign:'top',h:80,bold:true})+lines(e,14,80,e.w-28,e.h-100)});
T('footer',{n:'Footer',ic:'▄',w:1120,h:100,label:'Footer: contact details | © 2026 | social links',fill:'#d1d5db'});
T('hamburger',{n:'Menu icon',ic:'≡',w:56,h:48,fill:'none',dash:'none',label:'',draw:e=>[0,1,2].map(i=>`<rect x="${e.w*.15}" y="${e.h*(.2+i*.25)}" width="${e.w*.7}" height="${e.h*.12}" rx="2" fill="${e.stroke}"/>`).join('')});
T('icon',{n:'Icon',ic:'⭐',w:64,h:64,label:'Icon',fs:12,draw:e=>`<circle cx="${e.w/2}" cy="${e.h/2}" r="${Math.min(e.w,e.h)/2-1}" fill="${e.fill}" stroke="${stroke(e)}" stroke-width="2"/>`+label(e,{pad:4})});
T('link',{n:'Link',ic:'🔗',fill:'none',dash:'none',w:160,h:30,color:'#2563eb',label:'Read more',align:'left',draw:e=>label(e,{deco:'underline',pad:2})});
T('divider',{n:'Divider',ic:'—',w:1000,h:16,fill:'none',label:'',draw:e=>`<line x1="0" y1="${e.h/2}" x2="${e.w}" y2="${e.h/2}" stroke="${e.stroke}" stroke-width="2"${dashA(e)}/>`});
T('map',{n:'Map',ic:'🗺',w:360,h:240,fill:'#ecfdf5',label:'Map: shop location',draw:e=>box(e)+`<path d="M0,${e.h*.65} Q${e.w*.3},${e.h*.4} ${e.w*.55},${e.h*.7} T${e.w},${e.h*.5}" fill="none" stroke="${e.stroke}" opacity=".5" stroke-width="3"/><path d="M${e.w*.5},${e.h*.28} c-14,0 -22,10 -22,21 c0,15 22,33 22,33 c0,0 22,-18 22,-33 c0,-11 -8,-21 -22,-21 z" fill="#ef4444"/>`+pill(e,e.w/2,e.h-24,e.label,e.fs-2)});
T('slider',{n:'Image slider',ic:'⇆',w:1120,h:360,fill:'#f3f4f6',label:'Slideshow of photos',draw:e=>box(e)+cross(0,0,e.w,e.h,e.stroke)+`<text x="24" y="${e.h/2}" font-size="40" fill="${e.stroke}" dominant-baseline="middle" font-family="${FONT}">‹</text><text x="${e.w-24}" y="${e.h/2}" font-size="40" fill="${e.stroke}" text-anchor="end" dominant-baseline="middle" font-family="${FONT}">›</text>`+[0,1,2].map(i=>`<circle cx="${e.w/2-20+i*20}" cy="${e.h-20}" r="6" fill="${i?'#fff':e.stroke}" stroke="${e.stroke}"/>`).join('')+pill(e,e.w/2,e.h/2,e.label,e.fs)});
T('annot',{n:'Annotation',ic:'💬',w:260,h:110,fill:'#fef9c3',stroke:'#ca8a04',align:'left',fs:14,label:'Why: big buttons are easy to tap on a phone.',draw:(e,c)=>{const n=c.annNo[e.id]||1;return box(e,8)+`<circle cx="0" cy="0" r="16" fill="#dc2626"/>`+texts([String(n)],0,-8,16,{color:'#fff',bold:true})+label(e,{valign:'top',pad:12,x:6,w:e.w-6});}});
T('marker',{n:'Number marker',ic:'❶',w:36,h:36,fill:'#dc2626',stroke:'#dc2626',color:'#ffffff',bold:true,label:'1',fs:17,draw:e=>`<circle cx="${e.w/2}" cy="${e.h/2}" r="${Math.min(e.w,e.h)/2}" fill="${e.fill}"/>`+label(e,{pad:2})});

// SITE MAP
T('home',{n:'Home page',ic:'🏠',w:200,h:76,round:true,fill:'#4f46e5',stroke:'#312e81',color:'#ffffff',bold:true,fs:20,label:'Home'});
T('page',{n:'Main page',ic:'📄',w:190,h:70,round:true,fill:'#dbeafe',stroke:'#2563eb',bold:true,label:'Page'});
T('subpage',{n:'Sub-page',ic:'📃',w:170,h:62,round:true,fill:'#dcfce7',stroke:'#16a34a',label:'Sub-page'});
T('external',{n:'External link',ic:'↗',w:180,h:62,round:true,fill:'#ffffff',stroke:'#9333ea',dash:'dashed',color:'#6b21a8',label:'External site'});
T('file',{n:'Download file',ic:'📎',w:170,h:70,fill:'#fef3c7',stroke:'#d97706',label:'Menu (PDF)',draw:e=>`<path d="M0,0 H${e.w-18} L${e.w},18 V${e.h} H0 Z" fill="${e.fill}" stroke="${stroke(e)}" stroke-width="2"${dashA(e)}/><path d="M${e.w-18},0 V18 H${e.w}" fill="none" stroke="${stroke(e)}" stroke-width="2"/>`+label(e)});
T('key',{n:'Colour key',ic:'🔑',w:260,h:170,fill:'#ffffff',stroke:'#9ca3af',label:'Key',draw:e=>{const it=[['#4f46e5','Home page'],['#dbeafe','Main page'],['#dcfce7','Sub-page'],['#ffffff','External link'],['#fef3c7','Download file']];let s=box(e,8)+texts([e.label||'Key'],12,10,15,{anchor:'start',bold:true,color:e.color});const rh=(e.h-40)/it.length;it.forEach(([c,t],i)=>{s+=`<rect x="12" y="${36+i*rh}" width="26" height="${Math.min(18,rh-4)}" rx="4" fill="${c}" stroke="#6b7280"/>`+texts([t],46,36+i*rh+1,14,{anchor:'start',color:e.color});});return s;}});

// LAYOUT
const region=(id,n,ic,fill,lab,o={})=>T(id,Object.assign({n,ic,fill,stroke:'#475569',bold:true,fs:18,label:lab,w:560,h:140,draw:(e,c)=>box(e,6)+label(e,{h:e.h-(c.cols?22:0)})+(c.cols?texts([`${c.span(e)} of ${c.cols} columns`],e.w/2,e.h-26,13,{color:'#334155'}):'')},o));
region('r_header','Header','▀','#fecaca','Header',{w:1120,h:110});
region('r_nav','Navigation','☰','#fed7aa','Navigation',{w:1120,h:60});
region('r_hero','Hero banner','🌄','#fde68a','Hero banner',{w:1120,h:260});
region('r_main','Main content','📰','#bbf7d0','Main content',{w:740,h:420});
region('r_side','Sidebar','▐','#a5f3fc','Sidebar',{w:360,h:420});
region('r_block','Content block','▦','#c7d2fe','Content block',{w:360,h:220});
region('r_img','Image area','🖼','#e5e7eb','Image area',{w:360,h:220});
region('r_ad','Advert / offer','📣','#fbcfe8','Advert',{w:360,h:160});
region('r_footer','Footer','▄','#ddd6fe','Footer',{w:1120,h:110});

const HEAD=64,FOOT=50;
function pageSize(tool,pg){const T=TOOLS[tool];const W=T.devices?DEV[pg.device||'desktop'].w:T.W;return {w:W,h:pg.h||T.H};}
const today=()=>new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
function frameTop(tool,pg,w){const T=TOOLS[tool];const dv=T.devices?`  (${DEV[pg.device].n})`:'';return `<rect x="0" y="0" width="${w}" height="${HEAD}" fill="#f1f5f9"/><line x1="0" y1="${HEAD}" x2="${w}" y2="${HEAD}" stroke="#cbd5e1"/>`+
 texts([T.t.toUpperCase()],20,12,12,{anchor:'start',color:'#64748b',bold:true})+texts([pg.name+dv],20,30,22,{anchor:'start',color:'#0f172a',bold:true});}
function frameFoot(tool,pg,w,h){const T=TOOLS[tool];const nm=P.name.trim(),cl=P.cls.trim();const fs=w<600?12:15;const y=h-FOOT;
 const parts=[['Name: ',nm||'(add your name)',!nm],['Class: ',cl||'(add your class)',!cl]];
 let s=`<rect x="0" y="${y}" width="${w}" height="${FOOT}" fill="#1e1b4b"/>`;let x=16;
 parts.forEach(([a,b,miss])=>{s+=texts([a],x,y+(FOOT-fs)/2,fs,{anchor:'start',color:'#c7d2fe'});x+=tw(a,fs);s+=texts([b],x,y+(FOOT-fs)/2,fs,{anchor:'start',color:miss?'#fca5a5':'#ffffff',bold:true});x+=tw(b,fs,true)+24;});
 if(w>=600)s+=texts([`${T.t}: ${pg.name}   •   ${today()}`],w-16,y+(FOOT-fs)/2,fs,{anchor:'end',color:'#c7d2fe'});
 else s+=texts([pg.name],w-12,y+(FOOT-fs)/2,fs,{anchor:'end',color:'#c7d2fe'});return s;}
const MK=new Set();const mk=c=>{const id='ah'+String(c).replace(/[^a-z0-9]/gi,'');MK.add(c+'|'+id);return id;};
function markerDefs(){return '<defs>'+[...MK].map(s=>{const [c,id]=s.split('|');return `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`;}).join('')+'</defs>';}
function gridInfo(tool,pg){if(!TOOLS[tool].grid)return null;const {w}=pageSize(tool,pg);const cols=DEV[pg.device].cols;const m=w<600?16:40,g=w<600?12:20;const cw=(w-2*m-g*(cols-1))/cols;const starts=[],ends=[];for(let i=0;i<cols;i++){starts.push(m+i*(cw+g));ends.push(m+i*(cw+g)+cw);}
 return {cols,m,g,cw,starts,ends,span:e=>{let a=0,b=0;starts.forEach((s,i)=>{if(Math.abs(e.x-s)<Math.abs(e.x-starts[a]))a=i;});ends.forEach((s,i)=>{if(Math.abs(e.x+e.w-s)<Math.abs(e.x+e.w-ends[b]))b=i;});return Math.max(1,b-a+1);}};}
function gridSvg(gi,h){if(!gi)return '';return gi.starts.map(s=>`<rect x="${s}" y="${HEAD}" width="${gi.cw}" height="${h-HEAD-FOOT}" fill="#fecdd3" opacity=".35"/>`).join('')+gi.starts.map((s,i)=>texts([String(i+1)],s+gi.cw/2,HEAD+4,11,{color:'#e11d48'})).join('');}
function edgePt(r,tx,ty){const cx=r.x+r.w/2,cy=r.y+r.h/2;const dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return {x:cx,y:cy};const s=Math.min(dx?r.w/2/Math.abs(dx):1e9,dy?r.h/2/Math.abs(dy):1e9);return {x:cx+dx*s,y:cy+dy*s};}
function linkSvg(L,els,style,edit){const a=els.find(e=>e.id===L.from),b=els.find(e=>e.id===L.to);if(!a||!b)return '';const col=L.color||'#374151';let d,mid;
 const st=L.style||style;
 if(st==='elbow'){const ac={x:a.x+a.w/2,y:a.y+a.h/2},bc={x:b.x+b.w/2,y:b.y+b.h/2};
  if(b.y>=a.y+a.h+10){const y1=a.y+a.h,y2=b.y,my=y1+(y2-y1)/2;d=`M${ac.x},${y1} V${my} H${bc.x} V${y2}`;mid={x:(ac.x+bc.x)/2,y:my};}
  else if(a.y>=b.y+b.h+10){const y1=a.y,y2=b.y+b.h,my=y2+(y1-y2)/2;d=`M${ac.x},${y1} V${my} H${bc.x} V${y2}`;mid={x:(ac.x+bc.x)/2,y:my};}
  else{const left=bc.x<ac.x;const x1=left?a.x:a.x+a.w,x2=left?b.x+b.w:b.x,mx=(x1+x2)/2;d=`M${x1},${ac.y} H${mx} V${bc.y} H${x2}`;mid={x:mx,y:(ac.y+bc.y)/2};}}
 else{const bc={x:b.x+b.w/2,y:b.y+b.h/2},ac={x:a.x+a.w/2,y:a.y+a.h/2};const p1=edgePt(a,bc.x,bc.y),p2=edgePt(b,ac.x,ac.y);d=`M${p1.x},${p1.y} L${p2.x},${p2.y}`;mid={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2};}
 const arrow=st!=='elbow'&&!L.noArrow;const sel=edit&&S.sel&&S.sel.kind==='link'&&S.sel.id===L.id;
 let s=`<g data-link="${L.id}">${edit?`<path d="${d}" stroke="transparent" stroke-width="16" fill="none" style="cursor:pointer"/>`:''}<path d="${d}" stroke="${sel?'#4f46e5':col}" stroke-width="${sel?4:2.5}" fill="none"${L.dash?' stroke-dasharray="8 6"':''}${arrow?` marker-end="url(#${mk(sel?'#4f46e5':col)})"`:''}/>`;
 if(L.label){const fs=15,w=tw(L.label,fs,true)+14;s+=`<rect x="${mid.x-w/2}" y="${mid.y-13}" width="${w}" height="26" rx="13" fill="#fff" stroke="${col}"/>`+texts([L.label],mid.x,mid.y-8,fs,{bold:true,color:col});}
 return s+'</g>';}
function pageSvgInner(tool,pg,edit){MK.clear();const {w,h}=pageSize(tool,pg);const gi=gridInfo(tool,pg);
 const ctx={annNo:{},cols:gi?gi.cols:0,span:gi?gi.span:null};let n=0;pg.els.forEach(e=>{if(e.type==='annot')ctx.annNo[e.id]=++n;});
 const showGrid=gi&&(S.gridOn!==false||!edit);
 const body=(showGrid?gridSvg(gi,h):'')+pg.links.map(L=>linkSvg(L,pg.els,TOOLS[tool].links,edit)).join('')+
  pg.els.map(e=>`<g data-id="${e.id}" transform="translate(${e.x},${e.y})"${edit?' style="cursor:move"':''}>${(TY[e.type]||TY.rect).draw(e,ctx)}</g>`).join('');
 const frame=frameTop(tool,pg,w)+frameFoot(tool,pg,w,h);
 return {w,h,svg:`<rect width="${w}" height="${h}" fill="#ffffff"/>`+body+frame,defs:markerDefs()};}
function exportSvg(tool,pg){const r=pageSvgInner(tool,pg,false);return {w:r.w,h:r.h,svg:`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${r.w}" height="${r.h}" viewBox="0 0 ${r.w} ${r.h}">${r.defs}${r.svg}</svg>`};}

/* ===================== EDITOR ===================== */
const S={tool:'start',sel:null,drag:null,connect:false,from:null,zoom:{},gridOn:true,snap:true,clip:null};
const H={};// history per page id
const tdata=()=>P.tools[S.tool];
const curPg=()=>{const t=tdata();t.cur=clamp(t.cur||0,0,t.pages.length-1);return t.pages[t.cur];};
function hist(pg){return H[pg.id]||(H[pg.id]={u:[],r:[],last:JSON.stringify({els:pg.els,links:pg.links})});}
function commit(){const pg=curPg();const hh=hist(pg);const now=JSON.stringify({els:pg.els,links:pg.links});if(now===hh.last)return;hh.u.push(hh.last);if(hh.u.length>80)hh.u.shift();hh.r=[];hh.last=now;persist();updateBadges();}
let commitT;const commitSoon=()=>{clearTimeout(commitT);commitT=setTimeout(commit,400);};
function undo(redo){const pg=curPg();const hh=hist(pg);const src=redo?hh.r:hh.u,dst=redo?hh.u:hh.r;if(!src.length){toast(redo?'Nothing to redo':'Nothing to undo');return;}dst.push(hh.last);hh.last=src.pop();const o=JSON.parse(hh.last);pg.els=o.els;pg.links=o.links;S.sel=null;persist();draw();props();}

let ED=null;// dom refs of editor for current tool
function buildEditor(tool){const v=$('#v_'+tool);const T=TOOLS[tool];
 v.innerHTML=`<div class="ed"><aside class="pal">${PAL[tool].map(([g,ids])=>`<h4>${g}</h4><div class="items">${ids.map(id=>`<div class="pi" draggable="true" data-type="${id}" title="Drag onto the page, or click to add"><span class="ic">${TY[id].ic}</span>${TY[id].n}</div>`).join('')}</div>`).join('')}<p class="hint">Drag a shape onto the page, or click it to add it in the middle.</p></aside>
 <section class="mid"><div class="pagebar"></div><div class="toolbar"></div><div class="stage"><div class="modebar">🔗 Connect mode: click the first box, then the box it links to. Press Esc to stop.</div><svg xmlns="http://www.w3.org/2000/svg"></svg></div></section>
 <aside class="props"></aside></div>`;
 const pal=$('.pal',v);$$('.pi',pal).forEach(p=>{p.ondragstart=e=>{e.dataTransfer.setData('text/plain',p.dataset.type);};p.onclick=()=>addAtCentre(p.dataset.type);});
 const stage=$('.stage',v),svg=$('svg',v);
 stage.ondragover=e=>e.preventDefault();
 stage.ondrop=e=>{e.preventDefault();const type=e.dataTransfer.getData('text/plain');if(!TY[type])return;const p=svgPt(e);if(type==='photo'){pickPhoto(p);return;}const t=TY[type];addEl(type,p.x-t.w/2,p.y-t.h/2);};
 svg.addEventListener('pointerdown',onDown);svg.addEventListener('dblclick',e=>{const g=e.target.closest('[data-id]');if(g){S.sel={kind:'el',id:g.dataset.id};props();const ta=$('.props textarea');if(ta){ta.focus();ta.select();}}});
}
function ed(){const v=$('#v_'+S.tool);return {v,svg:$('svg',v),stage:$('.stage',v),props:$('.props',v),pagebar:$('.pagebar',v),toolbar:$('.toolbar',v)};}
function svgPt(e){const svg=ed().svg;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoom(){return S.zoom[S.tool]||(S.zoom[S.tool]='fit');}
function zoomVal(){const z=zoom();if(z!=='fit')return z;const {w}=pageSize(S.tool,curPg());const sw=ed().stage.clientWidth-48;return clamp(sw/w,.2,1.5);}
function draw(){if(!TOOLS[S.tool].canvas)return;const {svg}=ed();const pg=curPg();const r=pageSvgInner(S.tool,pg,true);
 svg.setAttribute('viewBox',`0 0 ${r.w} ${r.h}`);const z=zoomVal();svg.style.width=(r.w*z)+'px';svg.style.height=(r.h*z)+'px';
 svg.innerHTML=r.defs+r.svg+overlay(z);const zl=$('#zlab',ed().toolbar);if(zl)zl.textContent=Math.round(z*100)+'%';
 ed().stage.classList.toggle('connect',S.connect);}
function overlay(z){const pg=curPg();let s='';if(S.connect&&S.from){const e=pg.els.find(x=>x.id===S.from);if(e)s+=`<rect x="${e.x-6}" y="${e.y-6}" width="${e.w+12}" height="${e.h+12}" fill="none" stroke="#16a34a" stroke-width="${3/z}" stroke-dasharray="${8/z} ${5/z}"/>`;}
 if(!S.sel||S.sel.kind!=='el')return s;const e=pg.els.find(x=>x.id===S.sel.id);if(!e)return s;const hs=10/z;
 s+=`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" fill="none" stroke="#4f46e5" stroke-width="${2/z}" stroke-dasharray="${6/z} ${4/z}" pointer-events="none"/>`;
 const H8={nw:[0,0],n:[.5,0],ne:[1,0],e:[1,.5],se:[1,1],s:[.5,1],sw:[0,1],w:[0,.5]};const cur={nw:'nwse',se:'nwse',ne:'nesw',sw:'nesw',n:'ns',s:'ns',e:'ew',w:'ew'};
 for(const [k,[fx,fy]] of Object.entries(H8))s+=`<rect data-h="${k}" x="${e.x+e.w*fx-hs/2}" y="${e.y+e.h*fy-hs/2}" width="${hs}" height="${hs}" fill="#fff" stroke="#4f46e5" stroke-width="${2/z}" style="cursor:${cur[k]}-resize"/>`;return s;}
function bounds(){const {w,h}=pageSize(S.tool,curPg());return {x0:0,y0:HEAD,x1:w,y1:h-FOOT};}
function snapV(v){return S.snap?Math.round(v/10)*10:Math.round(v);}
function snapX(e){const gi=gridInfo(S.tool,curPg());if(!gi||!S.snap)return;const near=(v,arr)=>arr.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);const x0=near(e.x,gi.starts);let x1=near(e.x+e.w,gi.ends);if(x1<=x0)x1=gi.ends[gi.starts.indexOf(x0)];e.x=Math.round(x0);e.w=Math.round(x1-x0);}
function fitIn(e){const b=bounds();e.w=clamp(e.w,12,b.x1-b.x0);e.h=clamp(e.h,12,b.y1-b.y0);e.x=clamp(e.x,b.x0,b.x1-e.w);e.y=clamp(e.y,b.y0,b.y1-e.h);}
function addEl(type,x,y,extra){const pg=curPg();const e=mkEl(type,x,y,extra);const b=bounds();if(e.w>b.x1-b.x0-20&&['header','nav','footer','divider','slider','r_header','r_nav','r_hero','r_footer'].includes(type)){e.w=b.x1-b.x0-80;}
 e.x=snapV(x);e.y=snapV(y);fitIn(e);snapX(e);fitIn(e);pg.els.push(e);S.sel={kind:'el',id:e.id};commit();draw();props();return e;}
function centrePt(){const {stage}=ed();const r=stage.getBoundingClientRect();return svgPt({clientX:r.left+r.width/2,clientY:r.top+Math.min(r.height/2,260)});}
function addAtCentre(type){const p=centrePt();if(type==='photo'){pickPhoto(p);return;}const t=TY[type];let x=p.x-t.w/2,y=p.y-t.h/2;const pg=curPg();for(let i=0;i<12&&pg.els.some(e=>Math.abs(e.x-snapV(x))<20&&Math.abs(e.y-snapV(y))<20);i++){x+=30;y+=30;}addEl(type,x,y);}
let photoAt=null;
function pickPhoto(p){photoAt=p;$('#imgFile').value='';$('#imgFile').click();}
$('#imgFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const im=await loadImage(f,1600);const b=bounds();let w=Math.min(im.w,(b.x1-b.x0)*.6),h=w*im.h/im.w;if(h>(b.y1-b.y0)*.7){h=(b.y1-b.y0)*.7;w=h*im.w/im.h;}
 const p=photoAt||centrePt();addEl('photo',p.x-w/2,p.y-h/2,{src:im.src,w:Math.round(w),h:Math.round(h)});toast('Photo added. Drag the corners to resize it.','good');};
function loadImage(file,max){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res({src:c.toDataURL('image/jpeg',.85),w:c.width,h:c.height});};im.src=fr.result;};fr.readAsDataURL(file);});}

function onDown(ev){if(ev.button>0)return;const pg=curPg();const p=svgPt(ev);const hEl=ev.target.closest('[data-h]'),g=ev.target.closest('[data-id]'),lk=ev.target.closest('[data-link]');
 if(S.connect){if(!g){return;}const id=g.dataset.id;if(!S.from){S.from=id;draw();return;}if(id===S.from)return;
   if(!pg.links.some(l=>(l.from===S.from&&l.to===id)||(l.from===id&&l.to===S.from)))pg.links.push({id:uid(),from:S.from,to:id,label:''});else toast('Those two are already linked.');
   S.from=null;commit();draw();toast('Linked! Click two more boxes, or press Esc to stop.','good');return;}
 if(hEl&&S.sel){const e=pg.els.find(x=>x.id===S.sel.id);S.drag={mode:'resize',h:hEl.dataset.h,id:e.id,sx:p.x,sy:p.y,o:{x:e.x,y:e.y,w:e.w,h:e.h}};}
 else if(g){const e=pg.els.find(x=>x.id===g.dataset.id);S.sel={kind:'el',id:e.id};S.drag={mode:'move',id:e.id,sx:p.x,sy:p.y,o:{x:e.x,y:e.y,w:e.w,h:e.h}};props();}
 else if(lk){S.sel={kind:'link',id:lk.dataset.link};S.drag=null;props();}
 else{S.sel=null;S.drag=null;props();}
 draw();if(S.drag){window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp,{once:true});}}
function onMove(ev){const d=S.drag;if(!d)return;const pg=curPg();const e=pg.els.find(x=>x.id===d.id);if(!e)return;const p=svgPt(ev);const dx=p.x-d.sx,dy=p.y-d.sy;d.moved=d.moved||Math.abs(dx)+Math.abs(dy)>2;
 if(d.mode==='move'){e.x=snapV(d.o.x+dx);e.y=snapV(d.o.y+dy);fitIn(e);}
 else{let {x,y,w,h}=d.o;const k=d.h;if(k.includes('e'))w=d.o.w+dx;if(k.includes('s'))h=d.o.h+dy;if(k.includes('w')){x=d.o.x+dx;w=d.o.w-dx;}if(k.includes('n')){y=d.o.y+dy;h=d.o.h-dy;}
  if(ev.shiftKey&&['photo','ellipse','icon'].includes(e.type)){const r=d.o.w/d.o.h;h=w/r;}
  if(w<12){if(k.includes('w'))x-=12-w;w=12;}if(h<12){if(k.includes('n'))y-=12-h;h=12;}
  e.x=snapV(x);e.y=snapV(y);e.w=snapV(w)||12;e.h=snapV(h)||12;fitIn(e);}
 draw();}
function onUp(){window.removeEventListener('pointermove',onMove);const d=S.drag;S.drag=null;if(d&&d.moved){const e=curPg().els.find(x=>x.id===d.id);if(e){snapX(e);fitIn(e);}commit();draw();props();}}

 const kids=pg.links.filter(l=>l.from===p.id).map(l=>pg.els.find(e=>e.id===l.to)).filter(Boolean);const type=p.type==='home'?'page':'subpage';const t=TY[type];

function tidy(){const pg=curPg();const nodes=pg.els.filter(e=>['home','page','subpage','external','file'].includes(e.type));if(!nodes.length)return;
 const root=nodes.find(e=>e.type==='home')||nodes[0];const kids=id=>pg.links.filter(l=>l.from===id||l.to===id).map(l=>l.from===id?l.to:l.from);
 const parent={},order=[root.id],seen=new Set([root.id]);for(let i=0;i<order.length;i++){for(const k of kids(order[i]))if(!seen.has(k)&&nodes.some(n=>n.id===k)){seen.add(k);parent[k]=order[i];order.push(k);}}
 const ch=id=>order.filter(k=>parent[k]===id);const leaves=id=>{const c=ch(id);return c.length?c.reduce((a,k)=>a+leaves(k),0):1;};
 const {w}=pageSize(S.tool,pg);const total=leaves(root.id);const colW=Math.min(230,(w-80)/Math.max(1,total));let depthY=[HEAD+40,HEAD+200,HEAD+360,HEAD+520,HEAD+660];
 const place=(id,x0,depth)=>{const e=pg.els.find(n=>n.id===id);const span=leaves(id)*colW;e.x=Math.round(x0+span/2-e.w/2);e.y=depthY[Math.min(depth,4)];let x=x0;ch(id).forEach(k=>{place(k,x,depth+1);x+=leaves(k)*colW;});};
 place(root.id,(w-total*colW)/2,0);let lx=40;nodes.filter(n=>!seen.has(n.id)).forEach(n=>{n.x=lx;n.y=pageSize(S.tool,pg).h-FOOT-n.h-20;lx+=n.w+20;});
 pg.els.forEach(fitIn);commit();draw();toast(nodes.some(n=>!seen.has(n.id))?'Tidied. Boxes along the bottom are not linked yet.':'Site map tidied!','good');}
function toWire(){const pg=curPg();const names=pg.els.filter(e=>['home','page','subpage'].includes(e.type)).map(e=>e.label.trim()).filter(Boolean);const wp=P.tools.wire.pages;let n=0;

function hex6(h){h=String(h||'').trim();if(/^#?[0-9a-f]{3}$/i.test(h)){h=h.replace('#','');h='#'+h.split('').map(c=>c+c).join('');}if(!h.startsWith('#'))h='#'+h;return /^#[0-9a-f]{6}$/i.test(h)?h.toLowerCase():null;}
function lum(hex){const c=hex6(hex)||'#000000';const v=[1,3,5].map(i=>parseInt(c.substr(i,2),16)/255).map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2];}
function ratio(a,b){const l1=lum(a),l2=lum(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);}
const bestOn=bg=>ratio('#ffffff',bg)>=ratio('#111827',bg)?'#ffffff':'#111827';

 const LI={'Website name':'pencil','Colour scheme':'palette','Heading font':'type','Heading size':'type','Body size':'type','Body font':'type','Button corners':'corner','Contrast check':'check','Why I chose this style':'note'};
 $$('.formside label',v).forEach(l=>{const k=l.textContent.trim();if(LI[k])l.innerHTML=ic(LI[k])+esc(k);});
 $$('.formside .btnrow .ib',v).forEach(b=>{b.className='fbtn'+(b.classList.contains('ex')?' go':'');const tx=b.textContent.replace(/^[^A-Za-z]+/,'').trim();const icn=/Download/.test(tx)?'download':/site map/.test(tx)?'sitemap':/Remove/.test(tx)?'trash':'plus';b.innerHTML=ic(icn)+esc(tx);});}

/* ---------- help ---------- */
function showHelp(){const ov=$('#helpOv');const S8=[['hand','Add things','Drag a shape from the left panel onto the page, or click it to drop it in the middle.'],['cursor','Move and select','Click a box to select it. Drag it to move it.'],['resize','Resize','Drag the small white squares around a selected box.'],['pencil','Label everything','Double-click a box, or use the Label box on the right, to say what goes there.'],
 ['droplet','Colours and borders','Use the Colour and Border sections on the right, or the paint drop on the small black bar.'],['link','Join boxes','In the Site map and User flow, press Connect, then click two boxes.'],['page','Pages and sheets','Use the tabs above the page to add, rename or copy pages.'],['magic','Templates','Press Template in the toolbar for a ready-made starting point.'],
 ['camera','Hand-drawn work','Add a photo of your drawing with Photo / image. It sits inside the template with your name.'],['save','Save your work','Press Save my work at the end of every lesson. Open it next time with Open saved work.'],['zip','Hand in','Press Download all designs. You get every design as an image named by its page.'],['user','Name and class','Type them at the top. They appear in the footer of every design.']];
 ov.innerHTML=`<div class="help"><h2>${ic('help')} How to use the Web Design Studio</h2><p class="tip">Your work saves in this browser as you go. Right-click on the page for quick options.</p><div class="hgrid">${S8.map(([i,t,d])=>`<div class="hstep"><span class="hi">${ic(i)}</span><div><b>${t}</b><span>${d}</span></div></div>`).join('')}</div><div class="btnrow" style="justify-content:flex-end"><button class="big b" id="helpClose">${ic('check')}Got it</button></div></div>`;
 ov.classList.add('show');$('#helpClose').onclick=()=>ov.classList.remove('show');ov.onclick=e=>{if(e.target===ov)ov.classList.remove('show');};try{localStorage.setItem('wds_help_seen','1');}catch(e){}}

/* ---------- start view ---------- */
const TDESC={sitemap:'Plan every page and how they link together.',wire:'Sketch each page with labelled boxes and notes.',layout:'Place regions on a column grid for desktop and mobile.',flow:'Show the steps a visitor takes to finish a task.',style:'Pick colours and fonts, and check the contrast.',mood:'Collect images, colours and words for the look and feel.',content:'List the text, images and links for every page.'};
function buildStart(){const v=$('#v_start');const files=allFiles();const req=['sitemap','wire'],opt=['layout','flow','style','mood','content'];
 const ckRow=t=>{const s=score(t);const T=TOOLS[t],M=TMETA[t];return `<div class="ck" style="--c:${M.c}"><span class="rt">${ic(M.i)}</span><span class="t"><b>${T.t}</b>${T.req?'<span class="req">required</span>':''}<small>${s.done} of ${s.total} checks done</small><div class="bar"><i style="width:${s.total?s.done/s.total*100:0}%"></i></div></span><a data-go="${t}">Open ${ic('chevR')}</a></div>`;};
 v.innerHTML=`<div class="startv"><div class="start">
 <div class="card brief"><h2>${ic('flag')} Your task</h2><ul>
  <li><span class="bi">${ic('sitemap')}</span><span>Make a <b>site map</b> and a <b>wireframe for each page</b>. They can be hand-drawn and photographed, or made in software. Either is fine if they are clear and labelled.</span></li>
  <li><span class="bi">${ic('user')}</span><span>This studio is the software option. Every design sits in a template with your <b>name and class in the footer</b>.</span></li>
  <li><span class="bi">${ic('download')}</span><span>Submit your rendered design files too, <b>named by page</b>. The <b>Download all designs</b> button does this for you.</span></li>
  <li><span class="bi">${ic('camera')}</span><span>Hand-drawn? Use <b>Photo / image</b> in the Site map or Wireframes tool to add a photo of your drawing into the template.</span></li></ul></div>
 <div class="card"><h2>${ic('layers')} Design tools</h2><div class="tiles">${ORDER.slice(1).map(t=>`<button class="tile" data-go="${t}" style="--c:${TMETA[t].c}"><span class="rt">${ic(TMETA[t].i)}</span><span><b>${TOOLS[t].t}</b>${TOOLS[t].req?'<span class="req">required</span>':''}<p>${TDESC[t]}</p></span></button>`).join('')}</div>
  <p class="tip" style="margin:12px 0 0">Suggested order: Site map, then Content plan, Mood board and Style guide, Layout planner, Wireframes and User flow.</p></div>
 <div class="grid2"><div class="card"><h2>${ic('check')} Checklist</h2>${req.map(ckRow).join('')}<p class="tip" style="margin:12px 0 2px"><b>Extra planning tools</b> (use the ones your teacher asks for)</p>${opt.map(ckRow).join('')}
  <div class="ck" style="--c:${P.name.trim()&&P.cls.trim()?'#16a34a':'#94a3b8'}"><span class="rt">${ic('user')}</span><span class="t"><b>Name and class</b><small>${P.name.trim()&&P.cls.trim()?'Done. They appear in every footer.':'Type them at the top of the screen.'}</small></span></div></div>
 <div class="card"><h2>${ic('download')} Hand in your designs</h2><p class="tip">Each design downloads as a PNG image named by its page. The zip file holds them all.</p>
  <div class="btnrow"><button class="big" id="stZip">${ic('zip')}Download all designs (${files.length} files)</button><button class="big b" id="stSave">${ic('save')}Save my work</button></div>
  <ul class="files">${files.map((f,i)=>`<li>${ic('image')}<span>${esc(f.name)}</span><button data-f="${i}" title="Download this one">${ic('download')}</button></li>`).join('')}</ul>
  <p class="tip">${ic('save')} <b>Save my work</b> keeps a file you can open next lesson with <b>Open saved work</b>. Your work is also kept in this browser automatically.</p></div></div></div></div>`;
 $$('[data-go]',v).forEach(a=>a.onclick=()=>go(a.dataset.go));$('#stZip').onclick=downloadAll;$('#stSave').onclick=saveFile;
 $$('[data-f]',v).forEach(b=>b.onclick=()=>{const f=files[+b.dataset.f];if(!nameOK())return;pngBlob(f.tool,f.pg).then(bl=>saveBlob(bl,f.name));});}

/* ===================== TABS / ROUTING ===================== */
function tabs(){$('#tabs').innerHTML=ORDER.map((t,i)=>{const T=TOOLS[t],M=TMETA[t];let badge='';if(t!=='start'){const s=score(t);if(T.req||used(t))badge=`<span class="rb ${s.done===s.total?'d':T.req?'':'o'}">${s.done}/${s.total}</span>`;}
 return (i===1||i===3?'<hr>':'')+`<button class="ri ${S.tool===t?'on':''}" data-t="${t}" style="--c:${M.c}" title="${T.t}"><span class="rt">${ic(M.i)}</span>${M.s}${badge}</button>`;}).join('');$$('#tabs .ri').forEach(b=>b.onclick=()=>go(b.dataset.t));}
function updateBadges(){clearTimeout(badgeT);badgeT=setTimeout(tabs,300);}
let badgeT;
function go(t){closeMenu();S.tool=t;S.sel=null;S.connect=false;S.from=null;$$('.view').forEach(v=>v.classList.toggle('on',v.id==='v_'+t));tabs();
 if(t==='start')buildStart();else if(t==='style'){buildStyle();decorateForm('style');}else if(t==='content'){buildContent();decorateForm('content');}else{pagebar_();}
 try{history.replaceState(null,'','#'+t);}catch(e){}}
$('#views').innerHTML=ORDER.map(t=>`<section class="view" id="v_${t}"></section>`).join('');
['sitemap','wire','layout','flow','mood'].forEach(buildEditor);

/* ===================== SAVE / OPEN / NAME ===================== */
$('#helpBtn').innerHTML=ic('help');$('#saveBtn').innerHTML=ic('save')+'<span>Save my work</span>';$('#openBtn').innerHTML=ic('open')+'<span>Open saved work</span>';$('#zipBtn').innerHTML=ic('zip')+'<span>Download all designs</span>';
function saveFile(){const blob=new Blob([JSON.stringify(P)],{type:'application/json'});saveBlob(blob,`${safeName(P.name||'My')} ${safeName(P.cls||'')} - web design work.json`.replace(/\s+-/,' -'));toast('Saved. Keep this file safe and open it next lesson.','good');}
$('#saveBtn').onclick=saveFile;$('#openBtn').onclick=()=>{$('#openFile').value='';$('#openFile').click();};$('#helpBtn').onclick=showHelp;
$('#openFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o.tools||!o.tools.wire)throw 0;if(!confirm('Open this saved work? It replaces what is on screen now.'))return;
 const b=blank();P=Object.assign(b,o);['sitemap','wire','layout','flow','mood'].forEach(t=>{if(!P.tools[t])P.tools[t]=b.tools[t];});P.style=Object.assign(blank().style,o.style||{});P.content=o.content||{rows:[]};
 Object.keys(H).forEach(k=>delete H[k]);persist();$('#sName').value=P.name||'';$('#sClass').value=P.cls||'';go(S.tool);toast('Your saved work is open.','good');}catch(err){toast('That file is not saved web design work.','bad');}};fr.readAsText(f);};
$('#zipBtn').onclick=downloadAll;
$('#sName').value=P.name||'';$('#sClass').value=P.cls||'';
const nameUpd=()=>{P.name=$('#sName').value;P.cls=$('#sClass').value;$('#sName').classList.remove('miss');$('#sClass').classList.remove('miss');persist();if(TOOLS[S.tool].canvas)draw();else if(S.tool==='style')drawStyle();else if(S.tool==='content')drawContent();updateBadges();};
$('#sName').oninput=nameUpd;$('#sClass').oninput=nameUpd;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();$('#helpOv').classList.remove('show');}});
window.addEventListener('scroll',closeMenu,true);
const startTab=location.hash.slice(1);go(TOOLS[startTab]?startTab:'start');
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TOOLS[t]&&t!==S.tool)go(t);});
let seenHelp=false;try{seenHelp=!!localStorage.getItem('wds_help_seen');}catch(e){}if(!seenHelp)setTimeout(showHelp,400);
</script>
</body>
</html>
