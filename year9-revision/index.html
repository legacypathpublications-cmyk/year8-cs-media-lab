<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 9 ICT Revision Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e1b4b;--muted:#5b5a7a;--line:#e4e2f5;--bg:#f5f3ff;--pri:#6d4aff;--pri2:#5233e6;--yel:#ffc93c;--grn:#22c55e;--red:#ef4444;--hf:'Baloo 2','Nunito',system-ui,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,'Segoe UI',sans-serif;color:var(--ink);font-size:17px;min-height:100vh;background:#f5f3ff;background-image:radial-gradient(circle at 10% 0%,#e0f2fe 0,transparent 40%),radial-gradient(circle at 90% 10%,#fce7f3 0,transparent 35%),radial-gradient(circle at 50% 100%,#ede9fe 0,transparent 50%)}
h1,h2,h3,h4{font-family:var(--hf);margin:0;line-height:1.1}
button{font:inherit;color:inherit}
a{color:inherit}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(30,27,75,.96);color:#fff;backdrop-filter:blur(6px)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--hf);font-size:22px;font-weight:800;margin-right:auto;color:#fff}
.logo i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#ec4899);font-style:normal;font-size:20px}
.tbtn{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.13);color:#fff;text-decoration:none;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.24)}
.tbtn.home{background:#fff;color:var(--ink)}
.pill{background:var(--yel);color:var(--ink);font-weight:900;border-radius:99px;padding:6px 14px;white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 80px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:900;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri2);transition:transform .08s;text-decoration:none;font-size:16px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri2)}
.btn.g{background:var(--grn);box-shadow:0 4px 0 #15803d}.btn.y{background:var(--yel);color:var(--ink);box-shadow:0 4px 0 #d49b00}.btn.w{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}.btn.r{background:var(--red);box-shadow:0 4px 0 #b91c1c}
.btn[disabled]{opacity:.45;cursor:default}
/* HERO */
.hero{position:relative;border-radius:30px;padding:30px 30px 26px;color:#fff;overflow:hidden;background:linear-gradient(120deg,#6d4aff,#a855f7 55%,#ec4899);box-shadow:0 10px 0 rgba(30,27,75,.15)}
.hero h1{font-size:clamp(32px,5vw,52px)}
.hero p{font-size:19px;font-weight:700;max-width:640px;margin:8px 0 16px;opacity:.95}
.hero .bot{position:absolute;right:26px;bottom:-6px;width:190px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.bubble{position:absolute;right:215px;bottom:150px;background:#fff;color:var(--ink);border-radius:18px;padding:10px 14px;font-weight:800;max-width:230px;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.bubble::after{content:'';position:absolute;right:-12px;top:22px;border:8px solid transparent;border-left:14px solid #fff}
.prog{background:rgba(255,255,255,.2);border-radius:16px;padding:12px 16px;max-width:520px}
.prog .bar{height:14px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:8px}
.prog .bar i{display:block;height:100%;background:var(--yel);border-radius:99px;transition:width .8s}
.unit{margin-top:34px}
.uhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.uhead .badge{font-family:var(--hf);font-weight:800;background:var(--ink);color:#fff;border-radius:14px;padding:6px 14px;font-size:18px}
.uhead h2{font-size:28px}.uhead span{color:var(--muted);font-weight:800}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 12px 14px;border-radius:24px;background:#fff;border:3px solid var(--line);box-shadow:0 7px 0 var(--line);text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 13px 0 var(--line);border-color:var(--c)}
.tile .ill{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,#fff)}
.tile .ill svg{width:72px;height:72px}
.tile:hover .ill svg{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-8deg) scale(1.08)}75%{transform:rotate(7deg) scale(1.08)}}
.tile h3{font-size:20px}.tile small{color:var(--muted);font-weight:800;font-size:13px}
.tile .num{position:absolute;left:12px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;display:grid;place-items:center;font-size:14px}
.stars{color:#f5b301;letter-spacing:1px;font-size:20px;line-height:1}.stars .off{color:#dcd8f0}
.specials{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:34px}
.sp{display:flex;gap:14px;align-items:center;padding:18px;border-radius:24px;text-decoration:none;color:#fff;box-shadow:0 7px 0 rgba(30,27,75,.15);transition:transform .15s}
.sp:hover{transform:translateY(-5px)}
.sp .em{font-size:46px;width:70px;height:70px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.sp h3{font-size:22px}.sp p{margin:2px 0 0;font-weight:700;opacity:.92;font-size:15px}
/* TOPIC PAGE */
.thead{display:flex;gap:20px;align-items:center;padding:20px 24px;border-radius:28px;background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 60%,#1e1b4b));color:#fff;box-shadow:0 8px 0 rgba(30,27,75,.15);position:relative;overflow:hidden}
.thead .ill{width:104px;height:104px;border-radius:28px;background:rgba(255,255,255,.95);display:grid;place-items:center;flex:none}
.thead .ill svg{width:80px;height:80px}
.thead h1{font-size:clamp(28px,4vw,42px)}.thead p{margin:4px 0 0;font-weight:700;opacity:.95}
.thead .stars{font-size:26px;margin-top:6px}.thead .stars .off{color:rgba(255,255,255,.35)}
.crumb{display:inline-flex;align-items:center;gap:6px;font-weight:900;color:var(--pri2);text-decoration:none;margin-bottom:12px}
.ttabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.ttab{display:flex;align-items:center;gap:8px;border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 16px;font-weight:900;cursor:pointer;font-size:16px;box-shadow:0 4px 0 var(--line)}
.ttab .ok{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--line);color:#fff}
.ttab .ok.y{background:var(--grn)}
.ttab.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.panel{background:#fff;border:3px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 6px 0 var(--line)}
.ptitle{display:flex;align-items:center;gap:10px;margin-bottom:6px}.ptitle h2{font-size:26px}
.lead{color:var(--muted);font-weight:700;margin:0 0 16px}
/* LEARN CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.kc{border:3px solid var(--line);border-radius:22px;background:#fff;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s}
.kc.done{border-color:var(--grn)}
.kc .kh{display:flex;align-items:center;gap:12px;padding:14px 16px;background:color-mix(in srgb,var(--c) 9%,#fff)}
.kc .kh .ki{width:64px;height:64px;border-radius:18px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--line)}
.kc .kh .ki svg{width:50px;height:50px}
.kc h3{font-size:21px}
.kc .kb{padding:12px 16px 14px;flex:1;display:flex;flex-direction:column;gap:8px;font-weight:600;line-height:1.45}
.kc .kb b{font-weight:900}
.use{background:#f1f5f9;border-radius:12px;padding:7px 11px;font-size:15px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14.5px}
.pc div{border-radius:12px;padding:7px 10px}
.pc .p{background:#dcfce7}.pc .m{background:#fee2e2}
.pc b{display:block;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.got{margin-top:auto;align-self:flex-start;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-weight:900;cursor:pointer;font-size:14.5px}
.kc.done .got{background:var(--grn);border-color:var(--grn);color:#fff}
.diagram{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.diagram span{background:var(--c);color:#fff;border-radius:12px;padding:6px 10px;font-weight:900;font-size:14px;text-align:center}
.diagram em{font-style:normal;font-weight:900;color:var(--muted)}
/* QUIZ */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qbar{flex:1;height:14px;background:#efedfb;border-radius:99px;overflow:hidden}.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),#ffc93c);transition:width .4s}
.qtype{font-size:12.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 70%,#1e1b4b);border-radius:99px;padding:4px 10px;display:inline-block}
.qq,.opt span,.review div,.gapline{overflow-wrap:anywhere}
.qq{font-family:var(--hf);font-size:clamp(22px,3vw,30px);margin:10px 0 16px;line-height:1.2}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--line);background:#fff;border-radius:18px;padding:13px 15px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--line);font-size:17px}
.opt:hover{border-color:var(--c)}
.opt b{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--k)}
.opt.right{background:#dcfce7;border-color:var(--grn);box-shadow:0 4px 0 #86efac;animation:pop .45s}
.opt.wrong{background:#fee2e2;border-color:var(--red);box-shadow:0 4px 0 #fca5a5;animation:shake .4s}
@keyframes pop{40%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tf .opt{justify-content:center;font-size:24px;padding:22px;font-family:var(--hf)}
.gapline{font-size:22px;font-weight:800;line-height:1.7}
.slot{display:inline-block;min-width:150px;border-bottom:4px solid var(--c);text-align:center;color:var(--c);padding:0 8px;margin:0 4px}
.slot.right{color:var(--grn);border-color:var(--grn)}.slot.wrong{color:var(--red);border-color:var(--red)}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chipb{border:3px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.chipb:hover{border-color:var(--c)}.chipb.sel{background:var(--c);color:#fff;border-color:var(--c)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcols .col{display:flex;flex-direction:column;gap:8px}
.mi{border:3px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-weight:800;cursor:pointer;text-align:left;position:relative}
.mi.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.mi .tag{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;color:#fff;font-weight:900;display:grid;place-items:center;font-size:13px}
.mi.ok{border-color:var(--grn);background:#f0fdf4}.mi.no{border-color:var(--red);background:#fef2f2}
.olist{display:flex;flex-direction:column;gap:8px;max-width:620px}
.oi{display:flex;align-items:center;gap:10px;border:3px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-weight:800}
.oi .n{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.oi .mv{margin-left:auto;display:flex;gap:4px}.oi .mv button{border:2px solid var(--line);background:#fff;border-radius:9px;width:34px;height:32px;cursor:pointer;font-weight:900}
.oi.ok{border-color:var(--grn);background:#f0fdf4}.oi.no{border-color:var(--red);background:#fef2f2}
.fb{margin-top:16px;border-radius:16px;padding:12px 16px;font-weight:800;display:none;align-items:flex-start;gap:12px}
.fb.show{display:flex}.fb.g{background:#dcfce7;color:#14532d}.fb.r{background:#fee2e2;color:#7f1d1d}
.fb .fe{font-size:28px;line-height:1}
.qnav{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.result{text-align:center;padding:10px}
.result .big{font-size:84px;animation:pop .8s}
.result h2{font-size:36px}
.result .stars{font-size:44px;margin:8px 0}
.review{text-align:left;margin-top:16px;display:grid;gap:8px}
.review div{border-radius:14px;padding:10px 14px;background:#fef2f2;font-weight:700}
.review div.ok{background:#f0fdf4}
/* SORTER / MATCHER */
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border-radius:20px;background:#f8f7ff;border:3px dashed var(--line);min-height:76px}
.chip{display:flex;align-items:center;gap:8px;border:3px solid var(--line);background:#fff;border-radius:16px;padding:8px 12px;font-weight:900;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.chip:hover{border-color:var(--c);transform:translateY(-2px)}
.chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);transform:scale(1.05)}
.chip svg{width:34px;height:34px;flex:none}
.chip small{display:block;font-weight:700;color:var(--muted);font-size:12.5px}
.ghost{position:fixed;z-index:90;pointer-events:none;opacity:.92;transform:rotate(-4deg) scale(1.05)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
.bin{border:3px dashed var(--bc);border-radius:20px;padding:12px;min-height:140px;background:color-mix(in srgb,var(--bc) 8%,#fff);cursor:pointer;transition:transform .12s}
.bin:hover{transform:translateY(-3px)}
.bin h4{font-size:20px;color:var(--bc);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bin h4 small{margin-left:auto;font-family:'Nunito';font-size:14px;background:var(--bc);color:#fff;border-radius:99px;padding:1px 9px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
.bin .in span{background:#fff;border-radius:10px;padding:4px 9px;font-weight:800;font-size:13.5px;border:1px solid var(--line);animation:pop .35s}
.bin.yes{animation:pop .45s;background:#dcfce7}.bin.no{animation:shake .4s;background:#fee2e2}
.hintline{text-align:center;font-weight:800;min-height:28px;margin-top:10px;color:var(--muted)}
.targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.tg{border:3px solid var(--line);border-radius:20px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:8px;transition:transform .12s}
.tg .who{display:flex;gap:10px;align-items:flex-start;font-weight:800;line-height:1.35}
.tg .who .av{font-size:34px;line-height:1;flex:none}
.tg .drop{border:3px dashed var(--line);border-radius:14px;min-height:56px;display:flex;align-items:center;justify-content:center;color:#a8a4c8;font-weight:800;font-size:14px;gap:8px;padding:6px}
.tg.over .drop,.tg:hover .drop{border-color:var(--c)}
.tg.done{border-color:var(--grn);background:#f0fdf4}.tg.done .drop{border-style:solid;border-color:var(--grn);color:var(--ink)}
.tg.no{animation:shake .4s;border-color:var(--red)}
.tg .why{font-size:14.5px;font-weight:700;color:#166534;display:none}.tg.done .why{display:block}
.tg .drop svg{width:34px;height:34px}
/* SIMS */
.sim{border:3px solid var(--line);border-radius:22px;padding:16px;background:#fbfaff}
.simgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.screen{background:#0f172a;color:#e2e8f0;border-radius:16px;padding:14px;font-family:'Courier New',monospace;font-weight:700}
.screen .hl{background:#facc15;color:#111;border-radius:4px;padding:0 4px}
.dbt{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.dbt th,.dbt td{border:1px solid #cbd5e1;padding:6px 8px;text-align:left}.dbt th{background:#ede9fe}
.dbt tr.hit td{background:#fef08a;animation:pop .5s}
.cap{height:30px;background:#e5e7eb;border-radius:99px;overflow:hidden;position:relative;border:2px solid #cbd5e1}
.cap i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);transition:width .5s}
.cap span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px}
.ftile{display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px;font-weight:900;cursor:pointer;min-width:110px;box-shadow:0 4px 0 var(--line)}
.ftile:hover{border-color:var(--c)}.ftile .e{font-size:30px}.ftile small{color:var(--muted);font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{border:3px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.seg button svg{width:30px;height:30px}
.subh{font-family:var(--hf);font-size:22px;margin:22px 0 6px;display:flex;align-items:center;gap:8px}
.note{background:#fffbeb;border:2px solid #fde68a;border-radius:16px;padding:10px 14px;font-weight:700}
.mascot{display:flex;gap:12px;align-items:flex-end;margin:4px 0 14px}
.mascot svg{width:64px;flex:none}
.mascot .say{background:#fff;border:3px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:800}
/* FLASHCARDS */
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.fc{perspective:900px;height:170px;cursor:pointer;border:0;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center}
.fc .f{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#1e1b4b));color:#fff;font-family:var(--hf);font-size:26px;font-weight:800;box-shadow:0 6px 0 rgba(30,27,75,.15)}
.fc .b{background:#fff;border:3px solid var(--c);transform:rotateY(180deg);font-weight:800;line-height:1.35}
/* MISSION */
.mstep{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.mstep span{border-radius:99px;padding:5px 12px;font-weight:900;font-size:14px;background:#efedfb;color:var(--muted)}
.mstep span.on{background:var(--ink);color:#fff}.mstep span.d{background:#dcfce7;color:#166534}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.choice{border:3px solid var(--line);border-radius:20px;padding:14px;background:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--line)}
.choice:hover{border-color:var(--c)}.choice.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff)}
.choice svg{width:60px;height:60px}
.choice .price{font-weight:900;color:#166534}
.budget{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:14px;font-weight:900}
.budget .cap{flex:1}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.person{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px;font-weight:700;font-size:14.5px}
.person b{font-family:var(--hf);font-size:19px;display:block}
.person .av{font-size:30px}
.share{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.share canvas{width:100%;border-radius:18px;box-shadow:0 8px 0 rgba(30,27,75,.12);background:#fff}
.field{display:block;font-weight:900;margin:12px 0 6px}
.inp{width:100%;font:inherit;font-weight:800;padding:11px 13px;border-radius:14px;border:3px solid var(--line);background:#fff}
.inp.miss{border-color:#f87171;background:#fff1f2}
.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-weight:700;line-height:1.4}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:900}
.code{font-family:'Courier New',monospace;font-weight:700;word-break:break-all;background:#f1f5f9;border-radius:12px;padding:10px;font-size:13px}
.ctab{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px;background:#fff}
.ctab th,.ctab td{border:1px solid var(--line);padding:6px 8px;text-align:center}.ctab th{background:#ede9fe;font-size:12px}.ctab td:first-child,.ctab th:first-child{text-align:left}
.sharebar{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px 20px;border-radius:22px;background:#fff;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);text-decoration:none}
.sharebar .em{font-size:40px}.sharebar b{font-family:var(--hf);font-size:22px;display:block}.sharebar span{color:var(--muted);font-weight:700}
@media (max-width:900px){.share{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);opacity:0;z-index:99;background:var(--ink);color:#fff;font-weight:900;padding:12px 20px;border-radius:16px;transition:all .3s;max-width:92vw;text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}#toast.good{background:var(--grn)}#toast.bad{background:var(--red)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
@media (max-width:1400px){.bubble{display:none}}
@media (max-width:600px){.hero .bot{display:none}}
@media (max-width:900px){.path{grid-template-columns:1fr 1fr}.specials{grid-template-columns:1fr}.simgrid{grid-template-columns:1fr}.bubble{display:none}.hero .bot{width:120px;opacity:.5}}
@media (max-width:600px){.top{gap:6px;padding:10px 10px}.logo{font-size:16px;gap:6px}.logo i{width:30px;height:30px;font-size:16px}.pill{padding:5px 9px;font-size:14px}.tbtn{padding:7px 9px}.opts,.mcols{grid-template-columns:1fr}.top .tbtn span{display:none}.thead{flex-direction:column;text-align:center}.pc{grid-template-columns:1fr}.wrap{padding:16px 12px 70px}}
</style>
</head>

function drawPill(){if(typeof ORDER!=='undefined'&&totalStars()>=MAXSTARS&&!store.get('doneShown',0)){store.set('doneShown',1);setTimeout(()=>{toast('🏆 All '+MAXSTARS+' stars! Get your games code…','good');setTimeout(()=>location.hash='#done',1600);},600);}try{localStorage.setItem('y9rev_total',JSON.stringify(totalStars()));localStorage.setItem('y9rev_max',JSON.stringify(MAXSTARS));}catch(e){}$('#starPill').textContent=`⭐ ${totalStars()} / ${MAXSTARS}`;$('#muteBtn').textContent=muted?'🔇':'🔊';}
let toastT;function toast(m,k){const t=$('#toast');t.textContent=m;t.className='show '+(k||'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',2600);}
let AC;function beep(type){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;const seq={good:[523,659,784],bad:[260,180],pop:[880,1175],win:[523,659,784,1047,1319],tick:[700]}[type]||[440];o.type=type==='bad'?'sawtooth':'triangle';seq.forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.08));g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+seq.length*.08+.18);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+seq.length*.08+.2);}catch(e){}}
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],cRaf=null;
function confetti(n=150){cv.width=innerWidth;cv.height=innerHeight;const cols=['#6d4aff','#ec4899','#ffc93c','#22c55e','#0ea5e9','#f97316'];for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*7+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3,life:150});if(!cRaf)cLoop();}
function cLoop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);cRaf=parts.length?requestAnimationFrame(cLoop):(cx.clearRect(0,0,cv.width,cv.height),null);}
function mascot(text){return `<div class="mascot">${ART.robot}<div class="say">${text}</div></div>`;}
let cleanups=[];const onClean=f=>cleanups.push(f);

/* drag or click-to-place */
let picked=null;
function dragify(el,onDrop,onPick){el.addEventListener('pointerdown',e=>{if(el.classList.contains('used'))return;e.preventDefault();const sx=e.clientX,sy=e.clientY;let g=null;
 const mv=ev=>{if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){g=el.cloneNode(true);g.classList.add('ghost');g.style.width=el.offsetWidth+'px';document.body.appendChild(g);el.style.opacity=.35;}if(g){g.style.left=(ev.clientX-el.offsetWidth/2)+'px';g.style.top=(ev.clientY-22)+'px';}};
 const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);if(g){g.remove();el.style.opacity='';onDrop(document.elementFromPoint(ev.clientX,ev.clientY));}else onPick();};
 window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);});}

 const next=()=>{if(i>=qs.length)return end();const q=qs[i];const pct=i/qs.length*100;
  el.innerHTML=`<div class="qtop"><b>Question ${i+1} of ${qs.length}</b><div class="qbar"><i style="width:${pct}%"></i></div><b>⭐ ${Math.round(score*10)/10}</b></div><span class="qtype">${{mcq:'Multiple choice',tf:'True or false',gap:'Fill the gap',match:'Match up',order:'Put in order'}[q.type]}${q._topic?` • ${T[q._topic].t}`:''}</span><div class="qq">${esc(q.q)}</div><div id="qa"></div><div class="fb"><span class="fe"></span><div class="ft"></div></div><div class="qnav"><button class="btn" id="qnext" style="display:none">Next ➜</button></div>`;

const ACT={};

 host.innerHTML=`<div class="subh">🗂️ ${s.title}</div><p class="lead">${s.lead} You can also click a card, then click a group.</p><div class="tray"></div><div class="bins">${s.bins.map((b,i)=>`<div class="bin" data-b="${i}" style="--bc:${BC[i%5]}"><h4>${esc(b)}<small>0</small></h4><div class="in"></div></div>`).join('')}</div><div class="hintline"></div>`;

 $$('.bin',host).forEach(bin=>bin.onclick=()=>{if(sel)drop(sel,bin);});
 function drop(c,bin){const ok=+bin.dataset.b===+c.dataset.b;bin.classList.remove('yes','no');void bin.offsetWidth;
  if(ok){bin.classList.add('yes');beep('good');$('.in',bin).insertAdjacentHTML('beforeend',`<span>${esc(c.dataset.t)}</span>`);$('small',bin).textContent=$$('.in span',bin).length;c.remove();sel=null;$('.hintline',host).textContent='✅ Correct!';
   if(!$$('.chip',tray).length){tray.innerHTML=`<b>🎉 All sorted${mist?` with ${mist} mistake${mist>1?'s':''}`:' with no mistakes'}!</b>`;confetti(80);done();}}

   r(spent()<=BUD,`Budget: you spent <b>${fmt(spent())}</b> of ${fmt(BUD)}.`);r(true,`Report saved as <b>${esc(ch.file)}</b>.`);
   const st=pts>=5?3:pts>=4?2:1;if(st>=2){store.set('mission',1);drawPill();confetti();}beep('win');
   ms.innerHTML=`<div class="result"><div class="big">☕</div><h2>Report card for Noora</h2><div class="stars">${starStr(st)}</div><div class="review">${lines.map(l=>`<div class="${l.startsWith('✅')?'ok':''}">${l}</div>`).join('')}</div><p style="font-weight:800">${st>=2?'⭐ Mission star earned! Noora is impressed.':'Try again: link every reason to the café to earn the star.'}</p><div class="row" style="justify-content:center"><button class="btn" id="re">↺ Plan again</button><a class="btn w" href="#">🏠 Home</a></div></div>`;$('#re',ms).onclick=()=>renderMission(app);}};
 function choiceStep(ms,title,lead,opts,key,whysA,whysB){ms.innerHTML=`<div class="qq">${title}</div><p class="lead">${lead}</p><div class="choices">${opts.map(([k,n,d,price])=>`<button class="choice ${ch[key]===k?'on':''}" data-k="${k}">${art(k)}<b style="font-family:var(--hf);font-size:21px">${n}</b><span>${d}</span>${price?`<span class="price">${fmt(price)}</span>`:''}</button>`).join('')}</div><div id="why"></div><div class="qnav"><button class="btn w" id="bk">← Back</button><button class="btn" id="nx" ${ch[key+'Why']!==null?'':'disabled'}>Next ➜</button></div>`;
  const showWhy=()=>{const W=ch[key]===opts[0][0]?whysA:whysB;$('#why',ms).innerHTML=`<p style="font-weight:900;margin:14px 0 6px">Which reason would you give Noora?</p><div style="display:grid;gap:8px">${shuffle(W).map(([k,t,good])=>`<button class="opt" data-g="${good?1:0}"><span>${esc(t)}</span></button>`).join('')}</div><div class="hintline" id="wm"></div>`;
   $$('#why .opt',ms).forEach(b=>b.onclick=()=>{ch[key+'Why']=b.dataset.g==='1';$$('#why .opt',ms).forEach(x=>x.classList.remove('right','wrong'));b.classList.add(ch[key+'Why']?'right':'wrong');$('#wm',ms).innerHTML=ch[key+'Why']?'✅ Strong reason: it links to the café.':'💡 That reason does not link to the café. Pick a reason about the people and the busy days.';beep(ch[key+'Why']?'good':'bad');$('#nx',ms).disabled=false;});};
  $$('.choice',ms).forEach(b=>b.onclick=()=>{ch[key]=b.dataset.k;ch[key+'Why']=null;$$('.choice',ms).forEach(x=>x.classList.toggle('on',x===b));beep('pop');showWhy();if(key==='kitchen'){const sp=spent();const bud=$('.budget .cap',app);if(bud){$('i',bud).style.width=Math.min(100,sp/BUD*100)+'%';$('span',bud).textContent=`${fmt(sp)} of ${fmt(BUD)}`;}}});
  if(ch[key])showWhy();$('#bk',ms).onclick=()=>{step--;draw();};$('#nx',ms).onclick=()=>{step++;draw();};}
 draw();}

/* ================= CHALLENGE ================= */
function renderChallenge(app){const all=ORDER.flatMap(id=>T[id].quiz.map(q=>Object.assign({_topic:id},q)));const per={};const qs=[];
 shuffle(all).forEach(q=>{if(qs.length<15&&(per[q._topic]||0)<2){per[q._topic]=(per[q._topic]||0)+1;qs.push(q);}});
 app.innerHTML=`<a class="crumb" href="#">← All topics</a><section class="thead" style="--c:#6d4aff"><span class="ill" style="font-size:64px">🏆</span><div><h1>Mixed Challenge</h1><p>15 questions from every topic. Score 70% or more for a bonus star. Best so far: ${store.get('challenge',0)}%</p></div></section><div class="panel" style="margin-top:18px;--c:#6d4aff"><div id="qz"></div></div>`;
 runQuiz($('#qz',app),qs,pct=>{if(pct>store.get('challenge',0)){store.set('challenge',pct);drawPill();}},{backTo:'#'});}

/* ================= SHARE PROGRESS ================= */
/* ===== TEACHER SETTINGS =====
 FORM_URL: your Microsoft Forms pre-filled link. Make it with the sample answers NAME, CLASS, STARS, DETAILS and CODE.
 The website swaps those words for each student's real progress. Leave it empty until the form is ready. */
const FORM_URL='';
const TEACHER_EMAIL='';
const ARCADE_URL='https://legacypathpublications-cmyk.github.io/year8-cs-media-lab/year9-arcade/';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function hash(str){let h=7;for(const c of str)h=(h*31+c.charCodeAt(0))%1679616;return h.toString(36).padStart(4,'0');}
function makeCode(nm,cl){const body=['Y9R1',nm,cl,today(),ORDER.map(id=>{const p=prog(id);return [p.cards.length,p.play.length,p.quiz].join('-');}).join('_'),store.get('mission',0),store.get('challenge',0)].join('~');
 return btoa(unescape(encodeURIComponent(body+'~'+hash(body)))).replace(/=+$/,'');}
function readCode(code){try{const raw=decodeURIComponent(escape(atob(code.trim())));const parts=raw.split('~');const chk=parts.pop();if(parts[0]!=='Y9R1'||hash(parts.join('~'))!==chk)return null;
 const [, nm,cl,date,tp,mi,ch]=parts;const rows=tp.split('_').map((x,i)=>{const [c,pl,q]=x.split('-').map(Number);const id=ORDER[i];const t=T[id];return {id,stars:(c>=t.cards.length?1:0)+(pl>=t.play.length?1:0)+(q>=70?1:0),quiz:q};});
 return {nm,cl,date,rows,mission:+mi,challenge:+ch,total:rows.reduce((a,r)=>a+r.stars,0)+(+mi>=1?1:0)+(+ch>=70?1:0)};}catch(e){return null;}}
function summaryText(nm,cl){return `Year 9 ICT Revision Quest progress\nName: ${nm}\nClass: ${cl}\nDate: ${today()}\nStars: ${totalStars()} of ${MAXSTARS}\n`+ORDER.map((id,i)=>`${i+1}. ${T[id].t}: ${'★'.repeat(starsOf(id))}${'☆'.repeat(3-starsOf(id))}  quiz ${prog(id).quiz}%`).join('\n')+`\nQahwa House Mission: ${store.get('mission',0)?'done':'not yet'}\nMixed Challenge best: ${store.get('challenge',0)}%\nCheck code: ${makeCode(nm,cl)}`;}
function drawCard(cv,nm,cl){const W=1000,H=1320;cv.width=W;cv.height=H;const x=cv.getContext('2d');
 const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#6d4aff');g.addColorStop(.6,'#a855f7');g.addColorStop(1,'#ec4899');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle=g;x.fillRect(0,0,W,210);
 x.fillStyle='#fff';x.font='800 50px "Baloo 2", Arial';x.fillText('Year 9 ICT Revision Quest',44,82);x.font='800 26px Nunito, Arial';x.fillText('Progress card',46,124);
 x.font='900 30px Nunito, Arial';x.fillText(`${nm||'(name)'}   •   ${cl||'(class)'}`,46,178);x.textAlign='right';x.font='800 24px Nunito, Arial';x.fillText(today(),W-44,178);x.textAlign='left';
 const tot=totalStars();x.fillStyle='#fef3c7';x.beginPath();x.roundRect(44,236,W-88,86,22);x.fill();x.fillStyle='#1e1b4b';x.font='900 40px Nunito, Arial';x.fillText(`⭐ ${tot} of ${MAXSTARS} stars`,70,293);
 x.fillStyle='#e9e5ff';x.beginPath();x.roundRect(560,266,370,26,13);x.fill();x.fillStyle='#f59e0b';x.beginPath();x.roundRect(560,266,Math.max(26,370*tot/MAXSTARS),26,13);x.fill();
 let y=360;x.font='900 18px Nunito, Arial';x.fillStyle='#64748b';x.fillText('TOPIC',70,y);x.fillText('📖 LEARN',520,y);x.fillText('🎮 PLAY',650,y);x.fillText('✅ QUIZ',780,y);y+=18;
 ORDER.forEach((id,i)=>{const t=T[id],p=prog(id);const ry=y+i*62;x.fillStyle=i%2?'#faf9ff':'#fff';x.fillRect(44,ry,W-88,62);x.fillStyle=t.c;x.beginPath();x.arc(84,ry+31,18,0,7);x.fill();x.fillStyle='#fff';x.font='900 18px Nunito, Arial';x.textAlign='center';x.fillText(i+1,84,ry+37);x.textAlign='left';
  x.fillStyle='#1e1b4b';x.font='800 24px Nunito, Arial';x.fillText(t.t,116,ry+39);
  const mark=(ok,cx)=>{x.font='900 28px Nunito, Arial';x.fillStyle=ok?'#16a34a':'#cbd5e1';x.fillText(ok?'✔':'—',cx,ry+41);};
  mark(p.cards.length>=t.cards.length,548);mark(p.play.length>=t.play.length,672);x.font='900 24px Nunito, Arial';x.fillStyle=p.quiz>=70?'#16a34a':p.quiz?'#d97706':'#cbd5e1';x.fillText(p.quiz?p.quiz+'%':'—',790,ry+40);
  x.fillStyle='#f5b301';x.font='26px Arial';x.fillText('★'.repeat(starsOf(id)),880,ry+41);x.fillStyle='#dcd8f0';x.fillText('★'.repeat(3-starsOf(id)),880+26*starsOf(id),ry+41);});
 y+=ORDER.length*62+30;x.fillStyle='#1e1b4b';x.font='800 24px Nunito, Arial';x.fillText(`☕ Qahwa House Mission: ${store.get('mission',0)?'complete ✔':'not yet'}`,60,y);x.fillText(`🏆 Mixed Challenge best: ${store.get('challenge',0)}%`,540,y);
 y+=46;x.fillStyle='#f1f5f9';x.beginPath();x.roundRect(44,y,W-88,H-y-30,16);x.fill();x.fillStyle='#64748b';x.font='800 16px Nunito, Arial';x.fillText('CHECK CODE (for your teacher)',64,y+30);x.fillStyle='#1e1b4b';x.font='700 15px "Courier New", monospace';
 const code=makeCode(nm,cl);for(let i=0,l=0;i<code.length;i+=88,l++)x.fillText(code.slice(i,i+88),64,y+56+l*20);}
const normName=n=>String(n||'').toLowerCase().replace(/[^a-z]/g,'');
function unlockCode(name){let h=97;for(const c of normName(name)+'y9arcade')h=(h*131+c.charCodeAt(0))%1000003;return String(1000+h%9000);}
const who=()=>({nm:store.get('name','').trim(),cl:store.get('cls','').trim()});
function detailsText(){return ORDER.map((id,i)=>`${i+1} ${T[id].t}: ${starsOf(id)}/3 stars, quiz ${prog(id).quiz}%`).join(' | ')+` | Mission: ${store.get('mission',0)?'done':'not yet'} | Challenge best: ${store.get('challenge',0)}%`;}
function formLink(nm,cl){if(!FORM_URL)return null;const v={NAME:nm,CLASS:cl,STARS:`${totalStars()} of ${MAXSTARS}${totalStars()>=MAXSTARS?' (COMPLETE)':''}`,DETAILS:detailsText(),CODE:makeCode(nm,cl)};
 return FORM_URL.replace(/=(NAME|CLASS|STARS|DETAILS|CODE)(?=&|$)/g,(m,k)=>'='+encodeURIComponent(v[k]));}
function sendProgress(nm,cl,msgEl){const url=formLink(nm,cl);if(url){window.open(url,'_blank','noopener');store.set('sentAt',Date.now());if(msgEl)msgEl.innerHTML='✅ The form has opened in a new tab with your progress filled in. Press <b>Submit</b> there.';beep('good');return true;}
 const txt=summaryText(nm,cl);(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();});
 store.set('sentAt',Date.now());if(msgEl)msgEl.innerHTML='📋 Your teacher has not linked the form yet, so your progress has been <b>copied</b>. Paste it to your teacher in Teams with Ctrl + V.';return true;}
function renderShare(app){const nm0=store.get('name',''),cl0=store.get('cls','');
 app.innerHTML=`<a class="crumb" href="#">← All topics</a><section class="thead" style="--c:#16a34a"><span class="ill" style="font-size:60px">📤</span><div><h1>Send my progress</h1><p>Send your stars to your teacher at any time. They go straight into your teacher's spreadsheet.</p></div></section>
 <div class="share"><div class="panel"><label class="field">Your full name</label><input class="inp" id="nm" maxlength="40" placeholder="e.g. Sara Ali" value="${esc(nm0)}"><label class="field">Your class</label><input class="inp" id="cl" maxlength="12" placeholder="e.g. 9B" value="${esc(cl0)}">
  <div class="row" style="margin-top:16px"><button class="btn g" id="send" style="font-size:18px">📤 Send my progress to my teacher</button></div><div class="hintline" id="sm"></div>
  <div class="subh">📮 How it works</div><ol class="steps"><li>Type your name and class above.</li><li>Press <b>Send my progress to my teacher</b>. A Microsoft form opens with your stars already filled in.</li><li>Sign in with your school account if it asks, then press <b>Submit</b>. Done! 🎉</li></ol>
  <p class="note" style="margin-top:14px">💡 Send it whenever you like: after each topic, or when you reach ${MAXSTARS} stars. Your teacher always sees your newest progress.</p>
  <div class="row" style="margin-top:12px"><button class="btn w" id="dl">⬇ Download my progress card</button><button class="btn w" id="cp">📋 Copy my progress</button></div></div>
 <div><canvas id="card"></canvas></div></div>`;
 const cv=$('#card',app);const nmI=$('#nm',app),clI=$('#cl',app);
 const redraw=()=>{store.set('name',nmI.value.trim());store.set('cls',clI.value.trim());drawCard(cv,nmI.value.trim(),clI.value.trim());};
 nmI.oninput=redraw;clI.oninput=redraw;redraw();if(document.fonts)document.fonts.ready.then(redraw);
 const ok=()=>{const a=nmI.value.trim(),b=clI.value.trim();nmI.classList.toggle('miss',!a);clI.classList.toggle('miss',!b);if(!a||!b){toast('Type your name and class first.','bad');(a?clI:nmI).focus();return false;}return true;};
 $('#dl',app).onclick=()=>{if(!ok())return;redraw();cv.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=`${nmI.value.trim()} ${clI.value.trim()} Revision progress ${today()}.png`.replace(/[\\/:*?"<>|]/g,'');document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);});beep('good');$('#sm',app).textContent='✅ Saved! Now upload it to your Teams assignment.';};
 $('#cp',app).onclick=async()=>{if(!ok())return;const txt=summaryText(nmI.value.trim(),clI.value.trim());try{await navigator.clipboard.writeText(txt);$('#sm',app).textContent='✅ Copied! Paste it into Teams with Ctrl + V.';beep('good');}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();$('#sm',app).textContent='✅ Copied! Paste it into Teams with Ctrl + V.';}};
 $('#send',app).onclick=()=>{if(!ok())return;sendProgress(nmI.value.trim(),clI.value.trim(),$('#sm',app));};
 const tm=$('#tm',app);if(tm)tm.onclick=()=>{if(!ok())return;window.open(`https://teams.microsoft.com/l/chat/0/0?users=${encodeURIComponent(TEACHER_EMAIL)}&message=${encodeURIComponent(summaryText(nmI.value.trim(),clI.value.trim()))}`,'_blank','noopener');};}
function renderCheck(app){app.innerHTML=`<a class="crumb" href="#">← All topics</a><section class="thead" style="--c:#1e1b4b"><span class="ill" style="font-size:60px">🧑‍🏫</span><div><h1>Teacher: check progress codes</h1><p>Paste students' copied progress (or just their check codes). Each code is checked, so edited codes are flagged.</p></div></section>
 <div class="panel" style="margin-top:18px"><textarea class="inp" id="codes" rows="7" placeholder="Paste here. You can paste lots of students at once."></textarea><div class="row" style="margin-top:10px"><button class="btn" id="go">📊 Make class table</button><button class="btn w" id="csv">⬇ Download as CSV (Excel)</button></div><div id="out"></div></div>`;
 let rows=[];
 $('#go',app).onclick=()=>{const found=($('#codes',app).value.match(/[A-Za-z0-9+/]{40,}/g)||[]);const bad=[];rows=[];found.forEach(c=>{const r=readCode(c);if(r)rows.push(r);else bad.push(c);});
  rows.sort((a,b)=>(a.cl+a.nm).localeCompare(b.cl+b.nm));
  $('#out',app).innerHTML=(rows.length?`<table class="ctab"><tr><th>Name</th><th>Class</th><th>Date</th><th>⭐ Total</th>${ORDER.map((id,i)=>`<th title="${T[id].t}">${i+1}</th>`).join('')}<th>Mission</th><th>Challenge</th></tr>${rows.map(r=>`<tr><td><b>${esc(r.nm)}</b></td><td>${esc(r.cl)}</td><td>${esc(r.date)}</td><td><b>${r.total}/${MAXSTARS}</b></td>${r.rows.map(t=>`<td style="background:${['#fee2e2','#fef3c7','#dcfce7','#bbf7d0'][t.stars]}">${t.stars}★</td>`).join('')}<td>${r.mission?'✔':''}</td><td>${r.challenge}%</td></tr>`).join('')}</table><p class="lead" style="margin-top:8px">Topic numbers: ${ORDER.map((id,i)=>`${i+1} ${T[id].t}`).join(' • ')}</p>`:'<p class="lead">No valid codes found.</p>')+(bad.length?`<p class="note">⚠️ ${bad.length} code${bad.length>1?'s were':' was'} changed or incomplete, so ${bad.length>1?'they were':'it was'} left out.</p>`:'');};
 $('#csv',app).onclick=()=>{if(!rows.length){toast('Make the class table first.','bad');return;}const head=['Name','Class','Date','Total stars',...ORDER.map(id=>T[id].t),'Mission','Challenge %'];const lines=[head,...rows.map(r=>[r.nm,r.cl,r.date,r.total,...r.rows.map(t=>t.stars),r.mission?'Yes':'No',r.challenge])].map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download=`Revision Quest progress ${today()}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);};}

/* ================= 38/38: SEND + UNLOCK CODE ================= */
function renderDone(app){const done=totalStars()>=MAXSTARS;const w=who();
 if(!done){app.innerHTML=`<a class="crumb" href="#">← All topics</a><div class="panel" style="text-align:center"><div style="font-size:70px">🔒</div><h2>Not yet!</h2><p class="lead">Collect all ${MAXSTARS} stars to get your games code. You have ${totalStars()}.</p><a class="btn" href="#">Keep going ➜</a></div>`;return;}
 confetti(220);beep('win');
 app.innerHTML=`<section class="thead" style="--c:#f59e0b"><span class="ill" style="font-size:66px">🏆</span><div><h1>${MAXSTARS} out of ${MAXSTARS}! You did it!</h1><p>You finished the whole Year 9 ICT Revision Quest. Amazing work!</p></div></section>
 <div class="panel" style="margin-top:18px;--c:#f59e0b"><div class="subh" style="margin-top:0">Step 1: Send your progress to your teacher</div>
 <div class="row"><input class="inp" id="nm" style="max-width:280px" placeholder="Your full name" value="${esc(w.nm)}"><input class="inp" id="cl" style="max-width:140px" placeholder="Class" value="${esc(w.cl)}"><button class="btn g" id="send">📤 Send my progress</button></div><div class="hintline" id="sm" style="text-align:left"></div>
 <div class="subh">Step 2: Get your games code</div><div id="codebox"><p class="lead">Send your progress first, then your code appears here.</p></div></div>`;
 const showCode=()=>{const nm=$('#nm',app).value.trim();$('#codebox',app).innerHTML=`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div style="font-family:var(--hf);font-size:64px;letter-spacing:10px;background:#1e1b4b;color:#ffc93c;border-radius:22px;padding:6px 26px">${unlockCode(nm)}</div><div><p style="font-weight:800;margin:0 0 8px">This is <b>your</b> code. It only works with your name: <b>${esc(nm)}</b>.</p><a class="btn y" href="${ARCADE_URL}" target="_blank" rel="noopener">🎮 Open the Games Arcade</a></div></div>`;};
 $('#send',app).onclick=()=>{const nm=$('#nm',app).value.trim(),cl=$('#cl',app).value.trim();if(!nm||!cl){toast('Type your name and class first.','bad');return;}store.set('name',nm);store.set('cls',cl);sendProgress(nm,cl,$('#sm',app));store.set('codeOK',1);showCode();};
 if(store.get('codeOK',0)&&w.nm)showCode();}

/* ================= ROUTER ================= */
const app=$('#app');
function route(){cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];$('#toast').className='';const h=location.hash.slice(1).split('/');window.scrollTo(0,0);
 if(h[0]==='t'&&T[h[1]]){renderTopic(app,h[1],h[2]);document.title=T[h[1]].t+' | Year 9 ICT Revision';}
 else if(h[0]==='mission'){renderMission(app);document.title='Qahwa House Mission | Year 9 ICT Revision';}
 else if(h[0]==='share'){renderShare(app);document.title='Share my progress | Year 9 ICT Revision';}
 else if(h[0]==='done'){renderDone(app);document.title='Quest complete! | Year 9 ICT Revision';}
 else if(h[0]==='check'){renderCheck(app);document.title='Teacher check | Year 9 ICT Revision';}
 else if(h[0]==='challenge'){renderChallenge(app);document.title='Mixed Challenge | Year 9 ICT Revision';}
 else{renderHome(app);document.title='Year 9 ICT Revision Quest';}}
$('#muteBtn').onclick=()=>{muted=!muted;store.set('muted',muted);drawPill();};
window.addEventListener('hashchange',route);drawPill();route();
</script>
